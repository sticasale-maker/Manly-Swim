<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#113541">
<title>Who Lives Here — Cabbage Tree Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same tokens as index.html, so this reads as a page of the app rather than a
   separate product. Sand cards on deep teal, Bebas for headings. */
:root{
  --sky:#1b4754; --ocean:#4a8fad; --deep:#113541; --card:#c8bda0;
  --text:#113541; --dim:#4a5f6e; --border:rgba(180,210,230,.10);
  --sheet:#eaf0f3; --absent:rgba(17,53,65,.16); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(13px,3.4vw,15px)}
body{
  background:var(--deep);color:#dfe8ec;font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:0 10px 40px}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── top bar ─────────────────────────────────────────────────────────── */
:root{--head:52px}   /* measured from .top at boot; this is only the fallback */
.top{
  display:flex;align-items:center;gap:10px;padding:14px 2px 10px;position:sticky;top:0;
  background:var(--deep);z-index:20;
}
.back{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;letter-spacing:1px;
  color:var(--ocean);padding:4px 0;text-decoration:none;flex-shrink:0;
}
.top h1{
  font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:23px;
  letter-spacing:1.1px;color:#eaf3f6;line-height:1;flex:1;text-align:center;
}
.top .spacer{width:52px;flex-shrink:0}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{
  flex:1;font-family:'Bebas Neue',Impact,sans-serif;font-size:16px;letter-spacing:.9px;
  padding:9px 6px 7px;border-radius:10px;background:rgba(200,189,160,.13);
  color:#cfe0e7;text-align:center;
}
.tab.on{background:var(--card);color:var(--text)}

.strip{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;color:var(--text);
}
.vis{background:rgba(17,53,65,.05);border:1px solid rgba(17,53,65,.10);
  border-radius:12px;padding:11px 13px;margin-bottom:12px}
.visbars{display:flex;align-items:flex-end;gap:4px;height:62px;margin:10px 0 4px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.vb i{display:block;width:100%;border-radius:3px 3px 0 0;background:var(--ocean);opacity:.55}
.vb{border:0;background:transparent;cursor:pointer;padding:0}
.vb i{transition:opacity .12s}
.vb:hover i{opacity:.85}
.vb b{font-size:9px;font-weight:600;color:var(--dim)}
.vb.sel i{opacity:1;box-shadow:0 0 0 2px var(--ocean)}
.vb.sel b{color:var(--text);text-decoration:underline}
.vb.on i{opacity:1}
.vb.on b{color:var(--text)}
/* 3:2, cropped from the top of a square tile.
   The tile runs to 66.5S and the bottom third of it is empty Southern Ocean.
   With object-fit:cover a 3:2 box shows the top 66.7% of the square, which
   reaches 51.3S — past Stewart Island at 47.3S, so New Zealand stays whole.
   16:9 was tempting and stops at 45.1S, which cuts the bottom off it. */
.rangemap{position:relative;width:100%;aspect-ratio:3/2;border-radius:10px;
  overflow:hidden;background:rgba(17,53,65,.06);border:1px solid rgba(17,53,65,.10)}
.rangemap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center top;display:block}
.rangemap .pts{mix-blend-mode:multiply}
.stamp{font-size:9.5px;color:var(--dim);letter-spacing:.2px;text-align:right;margin-top:8px}

/* ── live band: real reports outrank anything modelled (§8) ──────────── */
.live{
  display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;
  background:rgba(74,143,173,.15);border-left:3px solid var(--ocean);margin-bottom:11px;
}
.live .t{font-size:12.5px;font-weight:600;line-height:1.3;display:block}
.live .d{font-size:10.5px;color:var(--dim);margin-top:2px;display:block}

.lbl{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:11.5px;letter-spacing:1.5px;
  color:var(--dim);text-transform:uppercase;margin:14px 0 7px;
}
.lbl:first-child{margin-top:0}

/* ── result rows ─────────────────────────────────────────────────────── */
.rows{display:block}
.row{
  display:flex;align-items:center;gap:11px;padding:8px 0;width:100%;text-align:left;
  border-top:1px solid rgba(17,53,65,.09);
}
.row:first-child{border-top:none}
/* 122px, from 54 in two steps. Half the reason anyone scans this list is the
   picture, and at 54 a leatherjacket and a morwong were two brown smudges.
   The baked files are 320px square, so even 122 has headroom on a 2x screen
   and only just runs out at 3x. Past this the file would have to be rebaked
   larger, which is 641 downloads, not a CSS edit. */
.row img{width:122px;height:122px;border-radius:16px;object-fit:cover;flex-shrink:0;background:rgba(17,53,65,.08)}
.row .sil,.hero.sil{display:flex;align-items:center;justify-content:center;background:rgba(17,53,65,.06)}
.row .sil{width:122px;height:122px;border-radius:16px;flex-shrink:0}
.row .sil svg{width:90px;height:60px}
.hero.sil{width:100%;height:210px;border-radius:12px}
.hero.sil svg{width:190px;height:127px}
.sil svg path,.sil svg ellipse,.sil svg rect{fill:var(--dim);opacity:.5}
.row.none img{filter:grayscale(1);opacity:.5}
.row .b{flex:1;min-width:0;display:flex;flex-direction:column}
.row .n{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:26px;letter-spacing:.8px;
  color:var(--text);line-height:1.05;display:block;
}
.row.none .n{color:var(--dim)}
/* The three text lines grew with the picture. At 81px the thumbnail was
   taller than the words beside it and the row had a band of dead space down
   its right; the type now fills the height the image sets. */
.row .s{font-size:14px;color:var(--dim);font-style:italic;margin-top:4px;display:block}
.row .w{font-size:14.5px;margin-top:5px;display:flex;align-items:center;gap:7px;color:var(--text)}
.row.none .w{color:var(--dim)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ocean);flex-shrink:0}
.row.none .dot{background:var(--absent)}
.rank{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;color:var(--dim);
  width:18px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;
}
.seen{margin-left:auto;font-size:13px;color:var(--ocean);flex-shrink:0}
/* Same 17px as the "N matches" line above it, because they are the same kind
   of thing: both head a list and say what is in it. At 10.5px this one read as
   a footnote to the list above rather than the title of the list below, which
   is the opposite of what it does. */
.divider{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:.8px;
  text-transform:uppercase;color:var(--dim);padding:12px 0 4px;margin-top:6px;
  border-top:1px solid rgba(17,53,65,.16);
}

/* ── identikit ───────────────────────────────────────────────────────── */
/* Pinned. The identikit is the thing you are building, and it was scrolling
   away exactly when it became useful — by the time you had picked a shape, a
   size and a colour, the drawing of what you remembered was off the top of the
   screen. Negative margins cancel the strip's padding so it spans the full
   width when stuck, and the background has to be opaque or the chips scroll
   through it. Sits below the page header's z-index, not above it. */
.idkit{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:var(--card);border-bottom:1px solid rgba(17,53,65,.12);
  position:sticky;top:var(--head);z-index:15;
  margin:-12px -14px 12px;border-radius:0;
}
.idkit .fish{width:96px;flex-shrink:0}
.idkit svg{display:block;width:100%;height:auto}
.idkit .t{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:23px;letter-spacing:.8px;
  color:var(--text);line-height:1.02;display:block;
}
.idkit .s{font-size:12.5px;color:var(--dim);margin-top:3px;display:block;line-height:1.35}

.search{
  display:flex;align-items:center;gap:8px;background:rgba(17,53,65,.06);
  border:1.5px solid rgba(17,53,65,.14);border-radius:10px;padding:8px 11px;margin-bottom:10px;
}
.search input{
  flex:1;min-width:0;border:none;background:none;outline:none;font-size:13.5px;
  color:var(--text);font-family:'Inter',sans-serif;
}
.search input::placeholder{color:var(--dim)}

/* Four questions, one open at a time.

   The numbers that forced this: on a 375px phone the four open grids came to
   705px, so a swimmer scrolled a whole screen of controls before reaching a
   single fish, and the only way the four had ever fitted was 8px shape labels
   and 26px chips — under every readable-type and tap-target guideline there
   is. Collapsed the four rows are ~190px, the answers stay visible as words,
   and the type can go up rather than down. */
.idkit .wiz{min-width:0;flex:1}
.pips{display:flex;align-items:center;gap:5px;margin-top:7px}
.pip{width:26px;height:5px;border-radius:3px;background:rgba(17,53,65,.18)}
.pip.on{background:var(--ocean)}
.pip.now{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text)}
.pipn{font-size:11.5px;color:var(--dim);margin-left:5px;letter-spacing:.3px}

.facets{margin:12px 0 6px;border-top:1px solid var(--border)}
/* The step number, and a tick once that step is answered. Small, because it is
   a place-marker rather than a thing to read. */
.facet .fn{
  flex:0 0 24px;text-align:center;font-size:16px;font-weight:600;
  color:var(--dim);font-variant-numeric:tabular-nums;
}
.facet.done .fn{color:var(--ocean)}
.facet.open .fn{color:var(--ocean)}
.facet{
  width:100%;display:flex;align-items:center;gap:10px;background:transparent;
  border:0;border-bottom:1px solid var(--border);padding:16px 2px;
  text-align:left;cursor:pointer;color:var(--text);
}
.facet.open{border-bottom-color:transparent}
.facet .fl{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:19px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--dim);flex:0 0 104px;
}
.facet.open .fl{color:var(--ocean)}
.facet .fv{font-size:17px;font-weight:500;color:var(--dim);flex:1 1 auto}
.facet .fv.set{color:var(--text);font-weight:600}
.facet .fx{font-size:20px;line-height:1;color:var(--dim);padding:0 6px;flex:0 0 auto}
/* The arrow on the row you are meant to answer next.

   Drawn, not typed. font-size:34px on a triangle GLYPH gives a mark about
   12px tall, because the character occupies a small part of its em box -- it
   was live and correct and still read as a tick-sized nothing. Marco could not
   see it. A CSS triangle is the size you say it is.

   And on the open row it sits in a filled disc. Ocean blue on the sand card is
   about 2.5:1, which is a colour you can find once you know it is there and
   not one that finds you; white on the deep hull is 11:1 and looks like a
   control rather than a decoration. */
.facet .fc{
  flex:0 0 26px;width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;border-radius:50%;transition:background .15s,width .15s,height .15s;
}
.facet .fc:before{
  content:'';width:0;height:0;display:block;
  border-left:6px solid transparent;border-right:6px solid transparent;
  border-top:7px solid var(--dim);
}
.facet.open .fc{flex:0 0 38px;width:38px;height:38px;background:var(--deep)}
.facet.open .fc:before{
  border-left-width:9px;border-right-width:9px;
  border-top:11px solid #fff;margin-top:2px;
  animation:nudge 1.4s ease-in-out infinite;
}
@keyframes nudge{
  0%,100%{transform:translateY(-1px)}
  50%{transform:translateY(3px)}
}
@media (prefers-reduced-motion:reduce){ .facet.open .fc:before{animation:none} }
.fbody{padding:2px 0 13px;border-bottom:1px solid var(--border)}
.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:7px}
.sh{
  border:1.5px solid rgba(17,53,65,.15);border-radius:10px;padding:5px 3px 3px;
  display:flex;flex-direction:column;align-items:center;
}
.sh svg{width:100%;height:auto}
.sh svg path,.sh svg rect{fill:var(--text)}
.sh svg circle{fill:var(--card)}
.sh .t{font-size:12.5px;color:var(--dim);text-align:center;line-height:1.2;margin-top:3px}
.sh.on{background:var(--ocean);border-color:var(--ocean)}
.sh.on .t{color:#fff}
.sh.on svg path,.sh.on svg rect{fill:#fff}
.sh.on svg circle{fill:var(--ocean)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  display:inline-flex;align-items:center;gap:7px;font-size:16px;font-weight:600;
  padding:11px 17px;border-radius:22px;border:1.5px solid rgba(17,53,65,.18);
  color:var(--dim);line-height:1.35;
}
.chip .sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(17,53,65,.25)}
/* Dead ends are greyed, not hidden. Removing them would leave the reader
   wondering where "hand-sized" went; showing them flat says the option exists
   and has nothing behind it, which is the same rule the rest of the page uses
   for absent data (§8). */
.chip.dead{opacity:.34;cursor:default;background:transparent}
.chip.dead:active{transform:none}
.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.chip.on .sw{border-color:rgba(255,255,255,.6)}
/* A colour pill keeps its own colour when picked -- turning it ocean blue
   would hide the one thing it is there to show. It is ringed instead, and
   carries a tick in whichever ink it can. */
.chip.col{border-color:rgba(17,53,65,.28)}
.chip.col.on{box-shadow:0 0 0 3px var(--deep);border-color:var(--deep)}
.chip.col .tick{font-size:14px;line-height:1;margin-right:-1px}
.more{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:12px;letter-spacing:1.2px;
  color:var(--ocean);padding:8px 0 2px;
}
.resbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:13px 0 2px;padding-top:11px;border-top:1px solid rgba(17,53,65,.14);
}
.resbar .l{font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:.8px}
.resbar .r{font-size:10.5px;color:var(--dim);text-align:right}

/* ── detail sheet ────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(9,26,33,.62);display:none;
  align-items:flex-end;justify-content:center;z-index:100;
}
.scrim.open{display:flex}
.sheet{
  width:100%;max-width:600px;background:var(--sheet);border-radius:20px 20px 0 0;
  padding:12px 14px calc(20px + env(safe-area-inset-bottom));max-height:92vh;
  overflow-y:auto;color:var(--text);
}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(17,53,65,.25);margin:0 auto 10px}
.x{position:sticky;top:0;float:right;width:34px;height:34px;margin:-4px -4px 0 0;
  font-size:26px;line-height:1;color:var(--dim);border-radius:50%;
  background:rgba(17,53,65,.07);z-index:2}
.hero{width:100%;height:210px;object-fit:cover;border-radius:12px;display:block;background:#0d2b35}
.attrib{font-size:9.5px;color:var(--dim);margin-top:6px;line-height:1.45}
.attrib a{color:var(--ocean)}
.dname{font-family:'Bebas Neue',Impact,sans-serif;font-size:29px;letter-spacing:1px;line-height:1;margin-top:12px}
.dsci{font-size:12px;font-style:italic;color:var(--dim);margin-top:2px}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dtag{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(17,53,65,.07);color:var(--dim)}
.block{margin-top:14px;padding-top:12px;border-top:1px solid rgba(17,53,65,.13)}
.months{display:flex;align-items:flex-end;gap:3px;height:46px}
.mo{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.mo .bar{width:100%;border-radius:2px 2px 0 0;background:rgba(17,53,65,.22);min-height:2px}
.mo.now .bar{background:var(--ocean)}
.mo .lb{font-size:8px;color:var(--dim)}
.mo.now .lb{color:var(--ocean);font-weight:700}
.cap{font-size:10.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.lifebtn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:14px;
  padding:11px;border-radius:10px;border:1.5px solid var(--ocean);color:var(--ocean);
  font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:1px;
}
.lifebtn.on{background:var(--ocean);color:#fff}
.close{
  width:100%;margin-top:8px;padding:10px;border-radius:10px;color:var(--dim);
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;letter-spacing:1px;
}
.empty{padding:36px 8px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
:focus-visible{outline:2px solid var(--ocean);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./">&larr; Swim</a>
    <h1>Who Lives Here</h1>
    <span class="spacer"></span>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabId">Identify</button>
    <button class="tab" id="tabNow">What's about now</button>
  </div>
  <div id="view"><div class="empty">Loading the bay…</div></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';

/* Identify opens by default now that it sits first — a leading tab that is not
   the one you land on reads as a mis-click waiting to happen. */
/* Content hashes of the two data files, written by tools/bake_ctbar.py at
   emit time and committed alongside them. Without this, species.html asked
   for species/ctbar.json with no version and a returning reader was served
   whatever their browser had cached: a local rebuild kept showing 640 species
   until the test server changed port, and behind Fastly the reader has no port
   to change. Hashed, not timestamped, so a re-bake that changes nothing leaves
   the URL alone and the cache stays warm. Do not edit by hand — the bake
   rewrites this exact line. */
var DATA_V={ctbar:"fc6acf4eee",shapes:"d9207e7321"};
var DATA=null, SHAPES=[], MODE='id', SEL={shape:null,colour:null,mark:null,size:null}, Q='';
/* Which of the four questions is expanded. One at a time, because all four
   open came to 705px on a 375px phone — a full screen of controls before a
   single result, which is what forced the 8px shape labels and the 26px chips
   in the first place. Collapsed, the four answers still read at a glance and
   the type can be the size it should always have been. */
var OPEN='shape';
var MON=['J','F','M','A','M','J','J','A','S','O','N','D'];
var FULL=['January','February','March','April','May','June','July','August',
          'September','October','November','December'];
var NOW=new Date().getMonth();

/* Preferences, not identity (§4): on-device only, mirrored to a 400-day cookie
   because Safari ITP evicts localStorage after 7 idle days. */
function persistGet(k){
  try{ var v=localStorage.getItem(k); if(v!==null) return v; }catch(e){}
  var m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)');
  return m?decodeURIComponent(m[2]):null;
}
function persistSet(k,v){
  try{ localStorage.setItem(k,v); }catch(e){}
  try{
    document.cookie=k+'='+encodeURIComponent(v)+';max-age='+(400*86400)+';path=/;SameSite=Lax';
  }catch(e){}
}
var SEEN=(function(){ try{ return JSON.parse(persistGet('wlh_seen')||'[]'); }catch(e){ return []; } })();
function seen(id){ return SEEN.indexOf(id)>=0; }
function toggleSeen(id){
  var i=SEEN.indexOf(id);
  if(i>=0) SEEN.splice(i,1); else SEEN.push(id);
  persistSet('wlh_seen',JSON.stringify(SEEN));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

/* ── identikit: the chips assemble into one animal, so a swimmer matches a
   picture against a memory instead of matching a memory against three words. */
var HUE={grey:'#8d9aa1',white:'#e8edef',black:'#2b3338',brown:'#8a6a45',green:'#5e8a52',
  blue:'#3d7fb5',yellow:'#e8c33f',orange:'#d98338',red:'#b0392f',pink:'#dd8fa2',purple:'#8f6fa8'};
var INK_D='#20313a', INK_L='#f4f7f8';
function luma(h){var n=function(i){return parseInt(h.slice(i,i+2),16);};
  return (0.299*n(1)+0.587*n(3)+0.114*n(5))/255;}
function shade(h,f){var n=function(i){return Math.round(parseInt(h.slice(i,i+2),16)*f);};
  return '#'+[n(1),n(3),n(5)].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');}

function idkit(shapeKey,hue,marks,finish){
  var sh=null,i;
  for(i=0;i<SHAPES.length;i++) if(SHAPES[i].key===shapeKey) sh=SHAPES[i];
  if(!sh) sh=SHAPES[0];
  if(!sh) return '';
  var W=84,H=56,m='',out='';
  var bodies=[],re=/<path d="([^"]+)"/g,mm;
  while((mm=re.exec(sh.path))) bodies.push(mm[1]);
  var eyes=[],re2=/<circle cx="([\d.]+)" cy="([\d.]+)" r="([\d.]+)"/g;
  while((mm=re2.exec(sh.path))) eyes.push([parseFloat(mm[1]),parseFloat(mm[2]),parseFloat(mm[3])]);
  var rects=[],re3=/<rect x="([\d.]+)" y="([\d.]+)" width="([\d.]+)" height="([\d.]+)"/g;
  while((mm=re3.exec(sh.path))) rects.push([mm[1],mm[2],mm[3],mm[4]]);
  var fill=HUE[hue]||HUE.grey, ink=luma(fill)<0.42?INK_L:INK_D;
  var eye=eyes.length?eyes[0]:null, x;

  if(marks.indexOf('bars-across')>=0)
    for(x=6;x<W;x+=11) m+='<rect x="'+x+'" y="-2" width="4.4" height="'+(H+4)+'" fill="'+ink+'" opacity=".72"/>';
  if(marks.indexOf('stripes-along')>=0)
    for(x=5;x<H;x+=8) m+='<rect x="-2" y="'+x+'" width="'+(W+4)+'" height="3.1" fill="'+ink+'" opacity=".72"/>';
  if(marks.indexOf('spots')>=0)
    for(var a=0,px=7;px<W;px+=10,a++) for(var b=0,py=7;py<H;py+=9,b++)
      if((a+b)%2===0) m+='<circle cx="'+px+'" cy="'+py+'" r="2.1" fill="'+ink+'" opacity=".66"/>';
  if(marks.indexOf('blotchy-mottled')>=0)
    [[14,18,7,5],[30,30,9,6],[48,16,8,5.5],[62,32,7.5,5],[24,40,6.5,4],[54,42,6,4]]
      .forEach(function(o){ m+='<ellipse cx="'+o[0]+'" cy="'+o[1]+'" rx="'+o[2]+'" ry="'+o[3]+'" fill="'+ink+'" opacity=".4"/>'; });
  if(marks.indexOf('one-dark-spot')>=0)
    m+='<circle cx="'+(W*0.66)+'" cy="'+(H*0.42)+'" r="5.4" fill="'+ink+'" opacity=".8"/>';
  if(marks.indexOf('dark-eye-bar')>=0&&eye)
    m+='<rect x="'+(eye[0]-3.4)+'" y="-2" width="6.8" height="'+(H+4)+'" fill="'+ink+'" opacity=".8"/>';
  if(marks.indexOf('net-or-scribble')>=0)
    for(x=-H;x<W+H;x+=9){
      m+='<path d="M'+x+' -2 L'+(x+H+4)+' '+(H+2)+'" stroke="'+ink+'" stroke-width="1.5" fill="none" opacity=".45"/>';
      m+='<path d="M'+x+' '+(H+2)+' L'+(x+H+4)+' -2" stroke="'+ink+'" stroke-width="1.5" fill="none" opacity=".3"/>';
    }

  var uid=Math.abs((shapeKey+hue+finish+marks.join()).split('').reduce(
    function(p,c){ return ((p<<5)-p+c.charCodeAt(0))|0; },0));
  var defs='',over='';
  if(finish==='silvery'){
    defs='<linearGradient id="f'+uid+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="#fff" stop-opacity=".62"/>'
      +'<stop offset=".42" stop-color="#fff" stop-opacity=".06"/>'
      +'<stop offset=".58" stop-color="#000" stop-opacity=".10"/>'
      +'<stop offset="1" stop-color="#fff" stop-opacity=".34"/></linearGradient>';
    over='<rect x="-2" y="-2" width="'+(W+4)+'" height="'+(H+4)+'" fill="url(#f'+uid+')"/>';
  }
  var clip=bodies.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
  var outline=bodies.map(function(d){
    return '<path d="'+d+'" fill="none" stroke="'+shade(fill,.62)+'" stroke-width="1.4" stroke-linejoin="round"/>'; }).join('');
  var seabed=rects.map(function(r){
    return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+INK_D+'" opacity=".3"/>'; }).join('');
  var eyeSvg=eyes.map(function(e){
    return '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="'+(e[2]+0.9)+'" fill="'+INK_L+'"/>'
         + '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="'+(e[2]*0.55)+'" fill="'+INK_D+'"/>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><clipPath id="c'+uid+'">'+clip+'</clipPath>'+defs+'</defs>'
    +'<g clip-path="url(#c'+uid+')"><rect x="-2" y="-2" width="'+(W+4)+'" height="'+(H+4)+'" fill="'+fill+'"/>'
    +m+over+'</g>'+outline+seabed+eyeSvg+'</svg>';
}

/* ── seasonality: raw counts divided by that month's total observing, or a
   quiet winter reads as an absent animal rather than a quiet winter. */
function share(sp,i){
  var e=DATA.effort[i]; return e?sp.months[i]/e*1000:0;
}

function sizeLabel(s){
  if(s.size_cm==null) return null;
  var b=null;
  DATA.size_buckets.forEach(function(x){ if(x.key===s.size_bucket) b=x; });
  return b?b.label:null;
}

/* The month count is a rarity measure in disguise: a species with two records
   has an 8% chance of one landing in September — exactly random — whether or
   not it lives here all year. 67% of the list has 12 records or fewer, so
   showing a month count would tell 400 species' worth of lies. Total records
   is always true. Anything anchored to the reef, and most small resident fish,
   are simply here. */
/* A species with no re-usable photograph used to be dropped from every view,
   which meant the app quietly knew about 37 animals it would not admit to. A
   shape is not a photograph and cannot be mistaken for one, so it stands in:
   the record is complete, and the absence is visible rather than silent (§8 —
   absent is grey, never dressed up as present). */
function silHTML(s,cls){
  var sh=null;
  for(var i=0;i<SHAPES.length;i++){ if(SHAPES[i].key===s.shape) sh=SHAPES[i]; }
  if(!sh) return '';
  return '<span class="'+(cls?cls+' ':'')+'sil" aria-label="No photograph — shown as a shape">'
    +'<svg viewBox="0 0 84 56" aria-hidden="true">'+sh.path+'</svg></span>';
}

/* An animal recorded at Manly but outside the reserve line.

   The whole page counts records inside iNaturalist place 71836, which stops at
   Fairy Bower. For something seen a hundred metres north of that the true
   count in the bay is zero, and printing "0 records in the bay" would be
   accurate and useless — it reads like a data fault rather than like a fish
   that was there yesterday. So the row says where it actually was. Absent is
   grey, never dressed up as present (§8), and never dressed down as missing
   either. */
function outsideShort(s){
  var o=s.outside; if(!o) return null;
  var d=o.on?new Date(o.on+'T00:00:00'):null;
  return (o.short||'Not in the bay count')+(d?', '+d.getDate()+' '+FULL[d.getMonth()]:'');
}
function outsideLong(s){
  var o=s.outside; if(!o) return '';
  var d=o.on?new Date(o.on+'T00:00:00'):null;
  /* Not "not a bay record" — this one was in the bay. It is missing from the
     COUNT, which is a different and smaller claim, and the note says why. */
  return '<p class="lbl">Not in the bay count</p>'
    +'<p style="font-size:13px">Recorded '+esc(o.where)
    +(d?', on '+d.getDate()+' '+FULL[d.getMonth()]+' '+d.getFullYear():'')+'.</p>'
    +(o.note?'<p class="cap">'+esc(o.note)+'</p>':'')
    +(o.obs?'<p class="cap"><a href="https://www.inaturalist.org/observations/'+o.obs
      +'" target="_blank" rel="noopener">see the observation</a></p>':'');
}

function rowHTML(s,rank,showMonth){
  var c=s.months[NOW];
  var word = outsideShort(s) || (showMonth
    ? 'Seen '+c+' time'+(c===1?'':'s')+' here in '+FULL[NOW]
    : s.annual+' record'+(s.annual===1?'':'s')+' in the bay');
  return '<button class="row" data-id="'+s.id+'">'
    +(rank?'<span class="rank">'+rank+'</span>':'')
    +(s.img?'<img loading="lazy" src="species/'+esc(s.img)+'" alt="">':silHTML(s,''))
    +'<span class="b"><span class="n">'+esc(s.name)+'</span>'
    +'<span class="s">'+esc(s.sci)+'</span>'
    +'<span class="w"><span class="dot"></span>'+word+'</span>'
    +(function(){ var w=morphWhy(s); return w
        ?'<span class="w" style="color:var(--dim)">'+esc(w)+'</span>':''; })()
    +'</span>'
    +(seen(s.id)?'<span class="seen">&#10003;</span>':'')+'</button>';
}

/* Which species are in season, and which are not.

   The season is computed entirely from NSW, so the BAY's own monthly counts
   are an independent check on whether it transfers. Over the 49 seasonal
   species with enough bay records it does: median r +0.76, 46 confirmed.

   The three that failed are why this is not a straight filter. Rough
   Leatherjacket has 215 bay records and r +0.03 — NSW calls it a September
   fish and the bay flatly does not agree. Estuary Cobbler is -0.17, backwards.
   A species that has been TESTED AND FAILED is excluded from both lists: the
   bay is the place the reader is standing, and when it contradicts NSW it wins.

   A species never tested (too few bay records) is a different case, and the
   two claims are not equally safe. "More often now" leans on NSW alone; being
   wrong means someone does not see a fish. "Less often now" may not, because
   being wrong means telling a swimmer they will not see something they are
   looking at. Never say "you won't see it" — only that it is seen less often,
   which survives being wrong. */
/* SEASON_MIN_SEEN is the floor that makes "more often now" mean anything.
   Concentration is a RATIO: a species with twelve records and three in
   September scores as a September animal, and you will still never see one.
   September's list read Port Jackson Shark seen 80 times, then Clown Doris
   seen 3, then five species seen once — which is not a list of what you are
   likely to meet, it is a list of rare things that happen to be clustered.
   Requiring five sightings in the bay in that month leaves only species you
   have a real chance of swimming past. */
var SEASON_HI=1.35/12, SEASON_LO=0.65/12, BAY_MIN_R=0.30, SEASON_MIN_SEEN=5;
var VISMONTH=null;   // which bar of the visitors chart is open, if any
var NOWMODE='top';

function seasonBucket(s){
  if(s.season!=='real' || !s.season_share) return null;
  var r=s.season_bay_r, share=s.season_share[NOW];
  if(r!=null && r<BAY_MIN_R) return null;         // the bay tested it and disagreed
  if(share>=SEASON_HI){
    /* The bay has to have seen it this month at least once. Without this the
       list printed "Roundbelly Cowfish — seen 0 times here in September" under
       a heading saying September is when you see it. NSW can say a species is
       a spring animal; it cannot say this bay has one when the bay's own
       records say otherwise, and the row contradicting its own heading is
       worse than the row being absent. */
    return (s.months && s.months[NOW] >= SEASON_MIN_SEEN) ? 'more' : null;
  }
  if(share<=SEASON_LO) return (r!=null && r>=BAY_MIN_R) ? 'less' : null;
  return null;
}

/* The species that arrive on the East Australian Current and do not last the
   winter. This is the biggest seasonal thing in the record and it was nowhere
   on the page: 89 species, an eighth of everything ever seen here, running from
   601 sightings in April to 7 in November.

   Drawn as twelve bars because the shape IS the point — a wave that builds
   through summer, breaks in April and is gone by spring. A sentence saying
   "more in autumn" would carry almost none of it. */
/* THE BAY'S YEAR PANEL WAS REMOVED, AND THIS IS THE REASON.
   It charted raw sightings by month and called April the richest. But raw
   sightings and the number of distinct species move together at r +0.90 —
   which is what you see when more people simply find more of everything — and
   species per 100 sightings is LOWEST in April (13.5) and highest in July
   (27.8). April is not richer water. It is when most people look.

   The whole seasonality was de-biased against exactly this earlier, and then
   this panel put the bias back on the screen in a prettier form. If you are
   tempted to plot bay counts by month again, plot a SHARE of that month's
   effort instead, the way the visitors panel now does.

   What survived is the one line that effort cannot fake: a species recorded
   once has been recorded once however many people were looking. */
function onceHTML(){
  var y=(DATA.provenance||{}).year;
  if(!y || !y.seen_once) return '';
  return '<p class="cap" style="margin:0 0 10px">'+y.seen_once+' of these '
    + DATA.species.length+' species have been recorded here exactly once. This is '
    +'a record of what has turned up, not a list to work through.</p>';
}

/* Tapping a bar opens the species behind it.

   Ranked by how much of a species' OWN year falls in that month, not by how
   many were seen — the chart above is already a share for the same reason, and
   a species with 40 records will otherwise sit above one with 8 in every month
   regardless of season. The bay count comes along so the reader can see how
   thin the evidence is: "62% of its year, seen 3 times here" is an honest thing
   to show and a misleading thing to hide. */
/* Where the animal lives, centred on Australia.

   The page could say what something looks like and when it turns up, and had
   no way to say whether it belongs here. That is the summer-visitor story from
   the other end and it reads instantly as a picture: the Eastern Blue Groper
   is one tight cluster on this coast and nowhere else on earth, while the
   Moorish Idol runs in a band across the whole Indo-Pacific and merely calls
   in. A sentence cannot do that as fast as a map can.

   Two stacked tiles from GBIF — a plain basemap and an occurrence layer — so
   there is no mapping library, no API key and nothing to keep up to date. Zoom
   2 tile 3/2 covers 90-180E and the equator to 66S: Australia whole, with
   enough of the Coral Sea and the Tasman to show where a visitor came from.

   Occurrences, not a modelled range. A hex is somewhere a person recorded the
   animal, so empty ocean means nobody looked as often as it means nothing
   lives there — said plainly in the caption rather than left to be assumed. */
var GBIF_TILE='2/3/2', GBIF_MAP='https://tile.gbif.org/3857/omt/';
function rangeHTML(s){
  if(!s.gbif) return '';
  var d='https://api.gbif.org/v2/map/occurrence/density/'+GBIF_TILE
        +'@2x.png?srs=EPSG:3857&style=classic.poly&bin=hex&hexPerTile=45&taxonKey='+s.gbif;
  return '<p class="lbl">Where it lives</p>'
    +'<div class="rangemap">'
    /* Not lazy. The card is built the moment it is opened, so there is nothing
       to defer — and a lazy image inside a container the browser has not laid
       out yet simply never loads. */
    +'<img class="base" src="'+GBIF_MAP+GBIF_TILE+'@2x.png?style=gbif-light" alt="" '
    +'decoding="async">'
    +'<img class="pts" src="'+esc(d)+'" alt="Recorded occurrences of '+esc(s.name)
    +'" decoding="async">'
    +'</div>'
    +'<p class="cap">Every place this species has been recorded, from GBIF. '
    +'Australia is centre; the map reaches from the equator to below New Zealand. '
    +'Blank water can mean nobody has looked there as easily as it can mean the '
    +'animal is absent.</p>';
}

function monthListHTML(mi){
  var v=(DATA.provenance||{}).visitors;
  if(!v || mi==null) return '';
  var set={}; v.taxa.forEach(function(t){ set[t]=1; });
  var rows=DATA.species.filter(function(s){
      return set[s.taxon_id] && s.season_share && (s.months||[])[mi]>0; })
    .sort(function(a,b){ return b.season_share[mi]-a.season_share[mi]; })
    .slice(0,12);
  if(!rows.length){
    return '<p class="cap" style="margin-top:8px">Not one of them was recorded here in '
      + FULL[mi]+'. That is the point of the low bar rather than a gap in the data.</p>';
  }
  return '<p class="lbl" style="margin:12px 0 6px">Most seasonal in '+FULL[mi]+'</p>'
    +'<div class="rows">'
    + rows.map(function(s){
        var pct=Math.round(s.season_share[mi]*100);
        return '<button class="row" data-id="'+s.id+'">'
          +(s.img?'<img loading="lazy" src="species/'+esc(s.img)+'" alt="">':silHTML(s,''))
          +'<span class="b"><span class="n">'+esc(s.name)+'</span>'
          +'<span class="s">'+esc(s.sci)+'</span>'
          +'<span class="w"><span class="dot"></span>'+pct+'% of its year falls in '
          + FULL[mi]+'</span>'
          +'<span class="w" style="color:var(--dim)">seen '+s.months[mi]+' time'
          +(s.months[mi]===1?'':'s')+' here in '+FULL[mi]+'</span></span>'
          +(seen(s.id)?'<span class="seen">&#10003;</span>':'')+'</button>'; }).join('')
    +'</div>';
}

function visitorsHTML(){
  var v=(DATA.provenance||{}).visitors, y=(DATA.provenance||{}).year;
  if(!v || !v.months) return '';
  /* Plotted as a SHARE of everything recorded that month, not as raw counts.
     Raw counts rise in summer partly because more people are in the water, and
     that is the confound this whole page keeps having to answer for. A share
     has the effort in its denominator: 0.7% of November against 23.4% of
     April is a statement about the fish. */
  var all=(y&&y.months)||null, raw=v.months;
  var m=all ? raw.map(function(c,i){ return all[i] ? c/all[i]*100 : 0; }) : raw;
  var mx=Math.max.apply(null,m), now=NOW;
  return '<div class="vis">'
    +'<p class="lbl" style="margin-top:0">Summer visitors</p>'
    +'<p style="font-size:13px">'+v.taxa.length+' species ride the current down '
    +'each summer and are gone by spring. Between them they are about an eighth '
    +'of everything ever recorded here.</p>'
    +'<div class="visbars">'
    + m.map(function(c,i){
        var h=Math.max(2,Math.round(c/mx*46));
        return '<button class="vb'+(i===now?' on':'')+(i===VISMONTH?' sel':'')
          +'" data-vm="'+i+'" title="'+FULL[i]+': '
          +(all?c.toFixed(1)+'% of that month ('+raw[i]+' sightings)':c)+'">'
          +'<i style="height:'+h+'px"></i><b>'+FULL[i].charAt(0)+'</b></button>'; }).join('')
    +'</div>'
    +'<p class="cap">'
    +(all
      ?'They are '+m[v.peak].toFixed(0)+'% of everything recorded in '+FULL[v.peak]
       +' and '+m[v.trough].toFixed(1)+'% in '+FULL[v.trough]+' — a share, so it is '
       +'not simply that more people swim in summer. '
      :'Sightings peak in '+FULL[v.peak]+' ('+raw[v.peak]+') and fall to '
       +raw[v.trough]+' in '+FULL[v.trough]+'. ')
    +'They settle here as young fish and do not survive a Sydney winter.'
    /* The lag is the interesting part and it was measured, not assumed: the
       same month agrees only weakly, two months earlier almost exactly. They
       are answering the water that was there while they were still drifting. */
    +(y && y.sst_lag ? ' Their numbers follow the water temperature of '
        +(['','a month','two months','three months'][y.sst_lag]||y.sst_lag+' months')
        +' earlier far more closely '
        +'than the water they arrive into.' : '')
    +'</p>'
    + monthListHTML(VISMONTH)
    +'</div>';
}

function renderNow(){
  var withImg=DATA.species.filter(function(s){ return s.img||s.shape; });
  var top=withImg.filter(function(s){ return s.months[NOW]>0; })
    .sort(function(a,b){ return b.months[NOW]-a.months[NOW]; }).slice(0,40);
  /* Ordered by how likely you are to MEET the animal, not by how tight its
     season is. Sorting on concentration read as though the lists were
     inverted: "more often now" led with a sidegill slug and a sea star that
     happen to peak in September, while the Port Jackson Shark — 248 records in
     this bay, 80 of them in September — sat sixth. And "less often now" led
     with species nobody here has seen in any month, instead of the Moorish
     Idol and the butterflyfishes, which people know and genuinely will not
     see now. A seasonal claim about an animal you have never met tells you
     nothing; the same claim about one you know is the whole point. */
  var more=withImg.filter(function(s){ return seasonBucket(s)==='more'; })
    .sort(function(a,b){ return b.annual-a.annual; });
  /* The LESS list sorts by how thin the month is, scarcest first — the point
     of the list is what you are least likely to meet, so that belongs at the
     top. The MORE list stays on bay records, because there the question is
     what you are most likely to actually run into. */
  var less=withImg.filter(function(s){ return seasonBucket(s)==='less'; })
    .sort(function(a,b){ return a.season_share[NOW]-b.season_share[NOW]; });

  var list = NOWMODE==='more' ? more : NOWMODE==='less' ? less : top;
  var blurb = NOWMODE==='more'
      ? 'These are at their most likely in '+FULL[NOW]+' — a bigger share of '
        +'the year\u2019s sightings falls now than in any average month.'
      : NOWMODE==='less'
      ? 'Seen less often in '+FULL[NOW]+'. Not absent \u2014 the bay keeps its '
        +'own counsel and these do turn up \u2014 just a thinner month for them.'
      : (function(){
          /* Was "ten years of observations by 206 contributors", both halves
             typed in and both gone stale — 302 people have contributed now and
             the record reaches back to 1998. A number in a sentence cannot age
             with the data behind it, so these come from the file. */
          var p=DATA.provenance||{};
          return p.observations
            ? p.observations.toLocaleString()+' observations of '+p.species
              +' species by '+p.contributors+' people, '+p.since+' to now'
            : 'From a decade of observations by the people who swim here';
        })();
  var head = NOWMODE==='more' ? 'More often seen in '+FULL[NOW]
           : NOWMODE==='less' ? 'Less often seen in '+FULL[NOW]
           : 'Most often seen around now';

  el('view').innerHTML=
    '<div class="strip">'
    /* No banner on "more often now". The chip above it is already lit and the
       list is already headed with the month, so the box only restated them —
       and the sentence it carried ("a bigger share of the year's sightings
       falls now") described the ratio test, which is no longer the whole rule
       since a species also has to have been seen here five times that month.
       The other two keep theirs: "seen most" carries where the counts come
       from, and "less often" carries the caveat that thin is not absent. */
    +(NOWMODE==='more' ? ''
      :'<div class="live"><span style="font-size:19px">&#128032;</span><span>'
       +'<span class="t">'+head+'</span>'
       +'<span class="d">'+blurb+'</span></span></div>')
    +'<div class="chips" style="margin-bottom:10px">'
    +  [['top','Seen most'],['more','More often now'],['less','Less often now']]
       .map(function(m){
         return '<button class="chip'+(NOWMODE===m[0]?' on':'')+'" data-now="'+m[0]+'">'
           +m[1]+'</button>'; }).join('')
    +'</div>'
    +(NOWMODE==='top' ? visitorsHTML()+onceHTML() : '')
    +'<p class="lbl">In '+FULL[NOW]+'</p>'
    +(list.length
      /* The "less often" list shows the ANNUAL count, not the month's. "Seen 0
         times here in September" under a heading about September reads as "you
         will not see it", which is the one thing this list must not say — and
         for these species it is weak evidence besides. Most are tropical strays
         with a handful of bay records in total, so a zero in any given month is
         what rarity looks like, not what a season looks like. The annual figure
         puts it back in proportion. */
      ?'<div class="rows">'+list.map(function(s,i){
          return rowHTML(s, NOWMODE==='top'?i+1:null, NOWMODE!=='less'); }).join('')+'</div>'
      :'<p class="empty">Nothing at its peak in '+FULL[NOW]+'.<br>'
       +(NOWMODE==='more'
         ?'The visitors that have a season here arrive with the autumn current \u2014 '
          +'March to June is when this list is long. Spring is quiet for them, and an '
          +'empty list is the honest answer rather than a thin one padded out.'
         :'Only species whose season the bay\u2019s own records back up appear here.')
       +'</p>')
    +(NOWMODE==='more' && list.length && list.length<5
      ?'<p class="cap">A short list because '+FULL[NOW]+' is a quiet month here. '
       +'The seasonal visitors come with the autumn current; March to June is when '
       +'this fills up.</p>':'')
    +(NOWMODE==='less'
      ?'<p class="cap">Only species whose season the bay\u2019s own records confirm '
       +'are listed. A thin month is not an absence, and the app will not tell you '
       +'what you cannot see.</p>':'')
    +'<p class="stamp">Counts as at '+DATA.generated_at.slice(0,10)+' &middot; rebuilt quarterly</p>'
    +'</div>';

  el('view').querySelectorAll('[data-now]').forEach(function(b){
    b.onclick=function(){ NOWMODE=b.dataset.now; VISMONTH=null; renderNow(); };
  });
  el('view').querySelectorAll('[data-vm]').forEach(function(b){
    b.onclick=function(){
      var m=+b.dataset.vm;
      VISMONTH = (VISMONTH===m) ? null : m;   // tap the same bar to close
      renderNow();
      if(VISMONTH!=null){
        var sel=el('view').querySelector('.vb.sel');
        if(sel) sel.scrollIntoView({block:'nearest'});
      }
    };
  });
}

/* Black or white text, whichever the pill can carry. Relative luminance, the
   sRGB coefficients: the yellow and the white take dark ink, the navy and the
   brown take light, and nothing has to be decided by eye one swatch at a time. */
function inkOn(hex){
  var r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16),
      b=parseInt(hex.substr(5,2),16);
  return ((0.2126*r + 0.7152*g + 0.0722*b) / 255) > 0.55 ? '#113541' : '#ffffff';
}
var COLOURS=[['grey','Silver / grey','#b9c4c9'],['brown','Brown','#8a6a45'],
  ['white','White','#e8edef'],['black','Black','#2b3338'],['yellow','Yellow','#e8c33f'],
  ['blue','Blue','#3d7fb5'],['green','Green','#5e8a52'],['red','Red','#b0392f'],
  ['orange','Orange','#d98338'],['pink','Pink','#dd8fa2'],['purple','Purple','#8f6fa8']];
var MARKS=[['plain','Plain'],['bars-across','Bars across'],['stripes-along','Stripes along'],
  ['spots','Spots'],['blotchy-mottled','Blotchy'],['one-dark-spot','One dark spot'],
  ['dark-eye-bar','Bar through the eye'],['net-or-scribble','Net or scribble']];

/* Shape, size and the search box EXCLUDE. Colour and markings only DEMOTE.
   Water eats red first, so 34% of these photos have their red badly
   suppressed and a brown Coffin Ray reads silver-grey. A colour tag
   therefore describes the photograph at least as much as the animal, and
   excluding on it would make a correctly-remembered animal unfindable.
   The swimmer's eye loses the same red at the same depth, so neither
   reading is authoritative — which is exactly why colour reorders instead
   of deciding. Same demote-never-hide rule as the out-of-season tail. */
function hardMatch(s){
  if(Q){
    var q=Q.toLowerCase();
    if((s.name+' '+s.sci).toLowerCase().indexOf(q)<0) return false;
  }
  if(SEL.shape && s.shape!==SEL.shape) return false;
  if(SEL.size && s.size_bucket!==SEL.size) return false;
  return true;
}
/* A record carries ONE colour, and for a lot of reef species that colour is
   the adult male. Matching only on it makes the female unfindable: someone who
   saw the brown-green female Blue Groper and taps "brown" gets nothing back,
   because the record says blue. So a facet matches if the primary record OR
   any verified morph matches. */
function morphHit(s,field,val){
  var ms=s.morphs||[];
  for(var i=0;i<ms.length;i++){
    var m=ms[i];
    if(field==='colour' && (m.colour===val || m.colour2===val)) return m;
    if(field==='mark' && (m.markings||[]).indexOf(val)>=0) return m;
  }
  return null;
}
function softMatch(s){
  if(SEL.colour && s.colour!==SEL.colour && s.colour2!==SEL.colour
     && !morphHit(s,'colour',SEL.colour)) return false;
  if(SEL.mark && (s.markings||[]).indexOf(SEL.mark)<0
     && !morphHit(s,'mark',SEL.mark)) return false;
  return true;
}
/* Why a blue fish came back for "brown". Without this the match reads as a
   bug: the row shows a blue Groper under a brown filter, next to a blue photo.
   Naming the morph turns a wrong-looking result into the useful half of the
   answer — that the thing they saw was the female. */
function morphWhy(s){
  var m = (SEL.colour && s.colour!==SEL.colour && s.colour2!==SEL.colour)
            ? morphHit(s,'colour',SEL.colour) : null;
  if(!m && SEL.mark && (s.markings||[]).indexOf(SEL.mark)<0) m=morphHit(s,'mark',SEL.mark);
  if(!m) return '';
  var who = String(m.label).replace(/-/g,' ');
  return 'the '+who+' is the one you saw';
}
function matches(s){ return hardMatch(s); }

/* How many species survive if this facet were answered THAT way.
   Size is the one worth asking about. Shape and size are the two axes that
   EXCLUDE, shape is answered first so nothing else is set to conflict with it,
   and colour and markings only demote — so the size step is the only tap in
   the four that can leave a swimmer with nothing at all. Ray plus hand-sized
   is empty, because rays here are not hand-sized, and the wizard was walking
   people into that with confidence. */
function countIf(key, val){
  var save = SEL[key], n = 0;
  SEL[key] = val;
  for (var i=0;i<DATA.species.length;i++){
    var s = DATA.species[i];
    if ((s.img || s.shape) && hardMatch(s)) n++;
  }
  SEL[key] = save;
  return n;
}

/* One question per row: its name, the answer so far, and a way to change it.

   The row is the summary and the control. Closed it says "Colour — Red", which
   is more than the old layout managed: there you had to scroll back up through
   three other grids to see what you had picked. Open it shows the choices, at
   a size someone can read in the sun with wet eyes.

   Tapping a chosen chip clears it, as it always did; the row also carries an X
   so a collapsed answer can be dropped without opening it. */
/* Four taps, and the page should say so.
   The rows already opened one at a time and advanced on their own, and nobody
   could tell: an accordion looks like four things you MIGHT do, not like a
   four-step job with an end. So each row is numbered, the header counts them
   off, and the question for the step you are on is written out in words.

   The third column is that question. The fourth is the honest caveat, because
   the four steps are not equal: shape and size EXCLUDE, colour and markings
   only DEMOTE (water eats red, so a colour describes the photograph at least
   as much as the animal). A wizard that presented all four as the same kind of
   answer would be lying about what the last two do. */
var FACETS=[
  ['shape','Shape','What shape was it?',null],
  ['size','Size','How big was it?',null],
  ['colour','Colour','What colour?','reorders the list rather than cutting it'],
  ['mark','Markings','Any markings?','reorders the list rather than cutting it']];
function nextUnanswered(){
  for(var i=0;i<FACETS.length;i++) if(!SEL[FACETS[i][0]]) return FACETS[i][0];
  return null;   // all four answered: close up and hand the screen to the list
}
function facetValue(k){
  if(k==='shape'){
    var out=null;
    SHAPES.forEach(function(sh){ if(sh.key===SEL.shape) out=sh.label; });
    return out;
  }
  if(k==='size') return SEL.size?sizeLabelFor(SEL.size):null;
  if(k==='colour'){
    var c=null;
    COLOURS.forEach(function(x){ if(x[0]===SEL.colour) c=x[1]; });
    return c;
  }
  var m=null;
  MARKS.forEach(function(x){ if(x[0]===SEL.mark) m=x[1]; });
  return m;
}
/* The counter. Four pips, the ones you have answered filled, the one you are
   on outlined. It says what to do next in the same breath as showing how far
   in you are, which is the whole job of a wizard header. */
function wizardHTML(){
  var done=FACETS.filter(function(f){ return !!SEL[f[0]]; }).length;
  var open=OPEN||nextUnanswered();
  var cur=null; FACETS.forEach(function(f){ if(f[0]===open) cur=f; });
  var t,sub;
  if(done===0){
    t='Four taps to name it';
    sub='Shape first &mdash; it is what people actually retain.';
  } else if(done<4){
    t='Tap '+(done+1)+' of 4 &mdash; '+esc(cur?cur[2]:'');
    sub=FACETS.filter(function(f){ return !!SEL[f[0]]; })
      .map(function(f){ return esc(String(facetValue(f[0])).replace(/-/g,' ')); }).join(' &middot; ');
    if(cur&&cur[3]) sub+=' <span style="opacity:.75">&mdash; this one '+cur[3]+'</span>';
  } else {
    t='That is the four';
    sub=FACETS.map(function(f){ return esc(String(facetValue(f[0])).replace(/-/g,' ')); }).join(' &middot; ');
  }
  return '<span class="t">'+t+'</span>'
    +'<span class="s">'+sub+'</span>'
    +'<span class="pips">'
    + FACETS.map(function(f,i){
        return '<span class="pip'+(SEL[f[0]]?' on':(f[0]===open?' now':''))+'"></span>'; }).join('')
    +'<span class="pipn">'+done+' of 4</span></span>';
}

function facetHTML(k,label,body,step){
  var v=facetValue(k), open=(OPEN===k);
  return '<button class="facet'+(open?' open':'')+(v?' done':'')+'" data-facet="'+k+'">'
    +'<span class="fn">'+(v?'&#10003;':step)+'</span>'
    +'<span class="fl">'+label+'</span>'
    +'<span class="fv'+(v?' set':'')+'">'+esc(v||'Any')+'</span>'
    +(v?'<span class="fx" data-clear="'+k+'" role="img" aria-label="Clear '+label+'">&times;</span>':'')
    +'<span class="fc" aria-hidden="true"></span></button>'
    +(open?'<div class="fbody">'+body+'</div>':'');
}

function renderId(){
  /* Photoless species are shown as silhouettes rather than dropped. */
  var all=DATA.species.filter(function(s){ return s.img || s.shape; });
  var hits=all.filter(matches);
  /* Most likely first: what is actually about this month, then how often the
     animal is seen here at all. */
  hits.sort(function(a,b){ return (b.months[NOW]-a.months[NOW]) || (b.annual-a.annual); });
  var soft=hits.filter(softMatch), off=hits.filter(function(s){ return !softMatch(s); });
  var shown=soft.slice(0,80), other=off.slice(0,30);
  var softOn=!!(SEL.colour||SEL.mark);

  el('view').innerHTML=
    '<div class="strip">'
    +'<div class="idkit"><span class="fish">'
    + idkit(SEL.shape||'torpedo', SEL.colour||'grey', SEL.mark?[SEL.mark]:[], null)
    +'</span><span class="wiz">'+wizardHTML()+'</span></div>'

    +'<div class="search"><span style="color:var(--dim)">&#128269;</span>'
    +'<input id="q" type="search" placeholder="Search '+DATA.species.length+' species…" value="'+esc(Q)+'"></div>'

    +'<div class="facets">'
    + facetHTML('shape','Shape','<div class="shapes">'
        + SHAPES.map(function(sh){
            return '<button class="sh'+(SEL.shape===sh.key?' on':'')+'" data-shape="'+sh.key+'">'
              +'<svg viewBox="0 0 84 56" aria-hidden="true">'+sh.path+'</svg>'
              +'<span class="t">'+esc(sh.label)+'</span></button>'; }).join('')
        +'</div>', 1)
    + facetHTML('size','Size',(function(){
        var dead=0;
        var chips=DATA.size_buckets.map(function(b){
          var n=(SEL.size===b.key)?1:countIf('size',b.key);
          if(!n) dead++;
          return '<button class="chip'+(SEL.size===b.key?' on':'')+(n?'':' dead')
            +'" data-size="'+b.key+'"'+(n?'':' disabled')
            +' title="'+(n?n+' of these':'nothing of that size matches what you have picked')+'">'
            +esc(b.label)+'</button>'; }).join('');
        return '<div class="chips">'+chips+'</div>'
          +(dead?'<p class="cap" style="padding-top:6px">Greyed sizes have nothing '
            +'at that shape. Change the shape, or leave the size out.</p>':'');
      })(), 2)
    + facetHTML('colour','Colour','<div class="chips">'
        + COLOURS.map(function(c){
            /* The pill IS the swatch. A 13px dot beside a word was asking
               someone to read a colour rather than see it, which is the wrong
               way round for the one question on this page that is purely
               visual. */
            return '<button class="chip col'+(SEL.colour===c[0]?' on':'')+'" data-colour="'
              +c[0]+'" style="background:'+c[2]+';color:'+inkOn(c[2])+'">'
              +(SEL.colour===c[0]?'<span class="tick">&#10003;</span>':'')+c[1]+'</button>'; }).join('')
        +'</div>', 3)
    + facetHTML('mark','Markings','<div class="chips">'
        + MARKS.map(function(m){
            return '<button class="chip'+(SEL.mark===m[0]?' on':'')+'" data-mark="'+m[0]+'">'
              +m[1]+'</button>'; }).join('')
        +'</div>', 4)
    +'</div>'

    +'<div class="resbar"><span class="l">'+soft.length+' match'+(soft.length===1?'':'es')+'</span>'
    +'<span class="r">Most likely first</span></div>'
    +'<div class="rows">'
    + shown.map(function(s){ return rowHTML(s,null); }).join('')
    + (softOn&&other.length
        ?'<div class="divider">'+softLabel()+' &middot; '+off.length+'</div>'
         +'<p class="cap" style="padding-bottom:4px">'+softWhy()+'</p>'
         + other.map(function(s){ return rowHTML(s,null); }).join(''):'')
    +'</div>'
    + (soft.length+off.length?'':'<p class="empty">Nothing matches all of that.<br>Try dropping a filter &mdash; the shape is the one most worth keeping.</p>')
    +'<p class="stamp">Attributes from photographs across NSW &middot; sightings from this bay &middot; '
    +'counts as at '+DATA.generated_at.slice(0,10)+'</p>'
    +'</div>';

  var q=el('q');
  if(q){
    q.addEventListener('input',function(e){
      Q=e.target.value;
      var pos=e.target.selectionStart;
      renderId();
      var n=el('q'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
    });
  }
}
/* The demoted tail has to name the thing that actually differs. Saying
   "a different colour" when the swimmer picked a marking is worse than saying
   nothing: it sends them checking a filter they never touched. */
function softLabel(){
  if(SEL.colour&&SEL.mark) return 'Recorded a different colour or markings';
  if(SEL.mark) return 'Recorded different markings';
  return 'Recorded a different colour';
}
function softWhy(){
  if(SEL.colour&&!SEL.mark)
    return 'Water eats red before anything else, so an animal can be photographed '
         + 'looking quite unlike itself. These match the shape.';
  if(SEL.mark&&!SEL.colour)
    return 'Markings are read from one photograph, and a pattern can be hidden by '
         + 'angle, growth or a fish that simply was not showing it. These match the shape.';
  return 'Colour and markings are both read from a single photograph, which water and '
       + 'angle can make unreliable. These match the shape.';
}
function sizeLabelFor(key){
  var out=null;
  DATA.size_buckets.forEach(function(b){ if(b.key===key) out=b.label; });
  return out;
}

function openDetail(id){
  var s=null;
  DATA.species.forEach(function(x){ if(String(x.id)===String(id)) s=x; });
  if(!s) return;
  var sh=s.months.map(function(_,i){ return share(s,i); });
  var peak=Math.max.apply(null,sh)||1;
  var best=0; sh.forEach(function(v,i){ if(v>sh[best]) best=i; });
  var tags=[s.shape,s.colour,(s.markings||[]).join(', '),s.where,s.finish]
    .filter(Boolean).map(function(t){ return String(t).replace(/-/g,' '); });
  var sz=sizeLabel(s);

  /* A sea star's 15 cm is an arm span, a chiton's is a shell and an urchin's is
     the test. Printing "15 cm" flat for all three is wrong in two of them, so
     say which ruler was used whenever it is not simple length. */
  function measureNote(s){
    if(!s.size_measure || s.size_measure==='total length') return '';
    return '<br><span style="color:var(--dim);font-size:11.5px">measured '
      + esc(s.size_measure).replace(/^(shell|body|carapace|mantle|float) /,'as $1 ')
      + '</span>';
  }
  /* An estimated size is not a sourced one and must not read like it (§8). */
  function estimateNote(s){
    return s.size_estimated
      ? '<br><span style="color:var(--dim);font-size:11.5px">estimated &mdash; '
        + 'no source states a typical size for this one</span>'
      : '';
  }

  /* Only claim a typical size when we actually have one. FishBase gives a
     maximum for 315 of these species and nothing else, and printing a record
     specimen's length under "typically about" is simply false: the Yellowtail
     False Fusilier's 50 cm maximum sat there while the fish you meet is 30-35.
     Where all we have is a ceiling, say ceiling. */
  var isTypical = (s.size_basis==='typical'||s.size_basis==='common');
  var sizeLine='';
  if(s.size_cm!=null && !isTypical){
    sizeLine='<p class="lbl">Size</p><p style="font-size:13px">'
      +'Grows to <strong>'+Math.round(s.size_cm)+' cm</strong>'
      +'<br><span style="color:var(--dim);font-size:11.5px">That is the largest on '
      +'record, not the one you are likely to meet — most adults are smaller.</span></p>'
      +(s.size_source&&s.size_source.indexOf('http')===0
        ? '<p class="cap"><a href="'+esc(s.size_source)+'" target="_blank" rel="noopener">source</a></p>'
        : (s.size_source?'<p class="cap">'+esc(s.size_source)+'</p>':''));
  } else if(s.size_cm!=null){
    sizeLine='<p class="lbl">Size</p><p style="font-size:13px">'
      +'Typically about <strong>'+Math.round(s.size_cm)+' cm</strong>'
      +(sz?' &mdash; '+esc(sz):'')
      /* Only worth saying when it adds something. FishBase often gives the
         same figure for both, and "typically 40 cm / grows to 40 cm" reads
         like the page is padding. */
      +(s.max_cm && Math.round(s.max_cm) > Math.round(s.size_cm)
        ?'<br><span style="color:var(--dim);font-size:11.5px">Grows to '+Math.round(s.max_cm)+' cm</span>':'')
      +measureNote(s)+estimateNote(s)
      +'</p>'
      +(s.size_source&&s.size_source.indexOf('http')===0
        ? '<p class="cap"><a href="'+esc(s.size_source)+'" target="_blank" rel="noopener">source</a></p>'
        : (s.size_source?'<p class="cap">'+esc(s.size_source)+'</p>':''));
  } else {
    /* Absent is grey, never invented (§8). */
    sizeLine='<p class="lbl">Size</p><p style="font-size:12.5px;color:var(--dim)">'
      +'No size on record for this one.</p>';
  }

  /* Background, not a sighting. Every one of these was written by a model and
     then had a second, stronger model try to refute it; only the survivors are
     here, and a refuted claim is dropped rather than softened.

     Moved above Size, because it is the reason most people open a card at all
     and it was sitting under three blocks nobody scrolls past. §8 still holds:
     it sits BELOW the photograph and its attribution, and below the sighting
     counts in the header, which are the real observations here. What it now
     outranks is a reference measurement, not anything anybody saw in the bay.
     It keeps the quieter type and keeps saying where it came from. */
  var factLine='';
  if(s.fact && s.fact_checked){
    /* Two different warrants, and the card must not blur them. Almost every
       line here was written by a model and then survived a stronger model
       trying to refute it. A handful were written or corrected by a person
       instead, and never went near the refuter — which is a weaker claim in
       one way and a stronger one in another, so it says which. */
    factLine='<p class="lbl">Worth knowing</p>'
      +'<p style="font-size:13px">'+esc(s.fact)+'</p>'
      +'<p class="cap">Background, not a bay record.'
      +(s.fact_by_hand?' Written by hand, not by the model.':'')+'</p>';
  }

  /* Two appearances, shown as such. This is the same knowledge the filter uses,
     so it must not be phrased as a separate claim that could drift from it. */
  var morphLine='';
  if((s.morphs||[]).length>1){
    morphLine='<p class="lbl">More than one appearance</p>'
      +s.morphs.map(function(m){
        var cols=[m.colour,m.colour2].filter(Boolean)
          .map(function(c){ return String(c).replace(/-/g,' '); }).join(' and ');
        return '<p style="font-size:13px"><strong>'
          + esc(String(m.label).replace(/-/g,' '))+'</strong>'
          + (cols?' &mdash; '+esc(cols):'')
          + (m.describe?'<br><span style="color:var(--dim);font-size:11.5px">'
             +esc(m.describe)+'</span>':'')+'</p>'; }).join('')
      +'<p class="cap">Both are this species. Either will find it in Identify.</p>';
  }

  el('sheet').innerHTML='<button class="x" id="xBtn" aria-label="Close">&times;</button>'
    +'<div class="grab"></div>'
    +(s.img
        ?'<img class="hero" src="species/'+esc(s.img)+'" alt="'+esc(s.name)+'">'
        :silHTML(s,'hero')
         +'<p class="cap">No re-usable photograph of this one has been taken in '
         +'the bay, so it is shown as its shape.</p>')
    /* Name the place the photograph was taken. It used to assert "taken in this
       bay" because the search was pinned to the bay, which starved the pool and
       hid 37 species outright. The photo shows the species; the records above
       are what tie it to this water. */
    +'<p class="attrib">'+(s.credit?'Photo &copy; '+esc(s.credit)+' &middot; iNaturalist'
        +(s.photo_place?' &middot; '+esc(String(s.photo_place).replace(/^["'\s]+|["'\s]+$/g,'')):''):'')
    +(s.obs_url?' &middot; <a href="'+esc(s.obs_url)+'" target="_blank" rel="noopener">observation</a>':'')
    +(s.distinctive?'<br>Look for: '+esc(s.distinctive):'')+'</p>'
    +'<p class="dname">'+esc(s.name)+'</p><p class="dsci">'+esc(s.sci)+'</p>'
    +'<div class="dtags">'+tags.map(function(t){ return '<span class="dtag">'+esc(t)+'</span>'; }).join('')+'</div>'
    +(function(){ var o=outsideLong(s); return o?'<div class="block">'+o+'</div>':''; })()
    +(s.grouping?'<p class="cap" style="margin-top:8px">Usually seen '+esc(s.grouping)+'</p>':'')
    +(factLine?'<div class="block">'+factLine+'</div>':'')
    +'<div class="block">'+sizeLine+'</div>'
    +(function(){ var r=rangeHTML(s); return r?'<div class="block">'+r+'</div>':''; })()
    +(morphLine?'<div class="block">'+morphLine+'</div>':'')
    /* Three states, because "has a season" is not the default. Of 589 species
       with enough NSW data, 174 have a real season and 415 are flat — and that
       is AFTER de-biasing, which moved 73 species out of "seasonal". Before it,
       species with no season at all were averaging 10.0% of their records in
       June and 6.4% in October, because June has the least observing and
       dividing by that small denominator inflated it. The bay
       cannot see any of this — 67% of the list has 12 local records or fewer —
       so the shape is read at NSW scale and labelled as such. */
    +(s.season==='real'
      ?'<div class="block"><p class="lbl">When it’s about</p>'
        +'<div class="months">'+(s.season_share||[]).map(function(v,i){
            var pk=Math.max.apply(null,s.season_share)||1;
            return '<div class="mo'+(i===NOW?' now':'')+'">'
              +'<div class="bar" style="height:'+Math.max(2,Math.round(v/pk*36))+'px"></div>'
              +'<div class="lb">'+MON[i]+'</div></div>'; }).join('')+'</div>'
        +'<p class="cap">Strongest in '+FULL[s.season_peak]+'. Read across NSW, from '
        +s.season_records+' records, and divided by how much observing happened each '
        +'month — the bay alone is too thinly recorded to show a season.</p></div>'
      : s.season==='flat'
      ?'<div class="block"><p class="lbl">When it’s about</p>'
        +'<p style="font-size:13px">Here <strong>all year</strong>.</p>'
        +'<p class="cap">'+s.season_records+' records across NSW show no month it favours. '
        +'Most things anchored to the reef, and most small resident fish, simply stay put.</p></div>'
      :'<div class="block"><p class="lbl">When it’s about</p>'
        +'<p class="cap">Too few records anywhere to say anything about the time of '
        +'year.</p></div>')
    +'<button class="lifebtn'+(seen(s.id)?' on':'')+'" id="lifeBtn">'
    +(seen(s.id)?'✓ Seen it':'Mark as seen')+'</button>'
    +'<button class="close" id="closeBtn">Close</button>';
  el('scrim').classList.add('open');
  el('xBtn').onclick=closeDetail;
  el('lifeBtn').onclick=function(){ toggleSeen(s.id); openDetail(id); render(); };
  el('closeBtn').onclick=closeDetail;
}
function closeDetail(){ el('scrim').classList.remove('open'); }

/* Measure rather than hardcode: the header is two lines on a narrow phone and
   one on a wide one, and a wrong offset shows either a gap or a chip sliding
   under the identikit. */
function syncHead(){
  var t=document.querySelector('.top');
  if(t) document.documentElement.style.setProperty('--head', Math.round(t.getBoundingClientRect().height)+'px');
}
addEventListener('resize', syncHead);

function render(){ syncHead(); if(MODE==='now') renderNow(); else renderId(); }

document.addEventListener('click',function(e){
  /* The X on a row sits inside the row's own button, so it has to be read
     first or the tap would only toggle the row open. */
  var cl=e.target.closest?e.target.closest('[data-clear]'):null;
  if(cl){ SEL[cl.dataset.clear]=null; OPEN=cl.dataset.clear; renderId(); return; }
  var fa=e.target.closest?e.target.closest('[data-facet]'):null;
  if(fa){ OPEN=(OPEN===fa.dataset.facet)?null:fa.dataset.facet; renderId(); return; }
  var t=e.target.closest?e.target.closest('[data-id],[data-shape],[data-colour],[data-mark],[data-size]'):null;
  if(!t) return;
  if(t.dataset.id!=null){ openDetail(t.dataset.id); return; }
  var k=t.dataset.shape?'shape':t.dataset.colour?'colour':t.dataset.mark?'mark':'size';
  var v=t.dataset[k==='mark'?'mark':k];
  SEL[k]=(SEL[k]===v)?null:v;
  /* Answering opens the next question you have not answered yet, in the order
     the rows are in: Shape is what people retain, so it leads, picking one
     opens Size, and so on. Answer the last and nothing is open, which puts the
     fish on the screen without a grid above them.

     Clearing leaves the question open, because the next thing you want after
     "not that colour" is another colour. */
  if(SEL[k]) OPEN=nextUnanswered();
  renderId();
});
/* Deliberately NO tap-to-dismiss on the backdrop. The sheet nearly fills a
   phone, so the dimmed strip above it looks like page, not like a control —
   and a stray tap there threw away whatever you were reading. Closing is the
   X, the Close button, Escape, or the back gesture: all deliberate. */
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDetail(); });
el('tabNow').onclick=function(){ MODE='now'; el('tabNow').classList.add('on'); el('tabId').classList.remove('on'); render(); };
el('tabId').onclick =function(){ MODE='id';  el('tabId').classList.add('on');  el('tabNow').classList.remove('on'); render(); };

Promise.all([
  fetch('species/ctbar.json?v='+DATA_V.ctbar).then(function(r){ return r.json(); }),
  fetch('species/shapes.json?v='+DATA_V.shapes).then(function(r){ return r.json(); })
]).then(function(res){
  DATA=res[0]; SHAPES=res[1];
  render();
}).catch(function(err){
  el('view').innerHTML='<div class="strip"><p class="empty">Couldn’t load the species list.'
    +'<br>It needs a connection the first time; after that it works offline.'
    +'<br><span style="opacity:.6">'+esc(err)+'</span></p></div>';
});
})();
</script>
</body>
</html>
