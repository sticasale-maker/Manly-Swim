<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#113541">
<title>Who Lives Here — Cabbage Tree Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Same tokens as index.html, so this reads as a page of the app rather than a
   separate product. Sand cards on deep teal, Bebas for headings. */
:root{
  --sky:#1b4754; --ocean:#4a8fad; --deep:#113541; --card:#c8bda0;
  --text:#113541; --dim:#4a5f6e; --border:rgba(180,210,230,.10);
  --sheet:#eaf0f3; --absent:rgba(17,53,65,.16); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(13px,3.4vw,15px)}
body{
  background:var(--deep);color:#dfe8ec;font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:0 10px 40px}
a{color:inherit}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ── top bar ─────────────────────────────────────────────────────────── */
.top{
  display:flex;align-items:center;gap:10px;padding:14px 2px 10px;position:sticky;top:0;
  background:var(--deep);z-index:20;
}
.back{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;letter-spacing:1px;
  color:var(--ocean);padding:4px 0;text-decoration:none;flex-shrink:0;
}
.top h1{
  font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:23px;
  letter-spacing:1.1px;color:#eaf3f6;line-height:1;flex:1;text-align:center;
}
.top .spacer{width:52px;flex-shrink:0}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{
  flex:1;font-family:'Bebas Neue',Impact,sans-serif;font-size:16px;letter-spacing:.9px;
  padding:9px 6px 7px;border-radius:10px;background:rgba(200,189,160,.13);
  color:#cfe0e7;text-align:center;
}
.tab.on{background:var(--card);color:var(--text)}

.strip{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:10px;color:var(--text);
}
.stamp{font-size:9.5px;color:var(--dim);letter-spacing:.2px;text-align:right;margin-top:8px}

/* ── live band: real reports outrank anything modelled (§8) ──────────── */
.live{
  display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;
  background:rgba(74,143,173,.15);border-left:3px solid var(--ocean);margin-bottom:11px;
}
.live .t{font-size:12.5px;font-weight:600;line-height:1.3;display:block}
.live .d{font-size:10.5px;color:var(--dim);margin-top:2px;display:block}

.lbl{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:11.5px;letter-spacing:1.5px;
  color:var(--dim);text-transform:uppercase;margin:14px 0 7px;
}
.lbl:first-child{margin-top:0}

/* ── result rows ─────────────────────────────────────────────────────── */
.rows{display:block}
.row{
  display:flex;align-items:center;gap:11px;padding:8px 0;width:100%;text-align:left;
  border-top:1px solid rgba(17,53,65,.09);
}
.row:first-child{border-top:none}
.row img{width:54px;height:54px;border-radius:9px;object-fit:cover;flex-shrink:0;background:rgba(17,53,65,.08)}
.row.none img{filter:grayscale(1);opacity:.5}
.row .b{flex:1;min-width:0;display:flex;flex-direction:column}
.row .n{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:18px;letter-spacing:.6px;
  color:var(--text);line-height:1.05;display:block;
}
.row.none .n{color:var(--dim)}
.row .s{font-size:10.5px;color:var(--dim);font-style:italic;margin-top:2px;display:block}
.row .w{font-size:11px;margin-top:3px;display:flex;align-items:center;gap:5px;color:var(--text)}
.row.none .w{color:var(--dim)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ocean);flex-shrink:0}
.row.none .dot{background:var(--absent)}
.rank{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;color:var(--dim);
  width:18px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;
}
.seen{margin-left:auto;font-size:13px;color:var(--ocean);flex-shrink:0}
.divider{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:10.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--dim);padding:10px 0 4px;margin-top:6px;
  border-top:1px solid rgba(17,53,65,.16);
}

/* ── identikit ───────────────────────────────────────────────────────── */
.idkit{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  background:rgba(17,53,65,.05);border:1px solid rgba(17,53,65,.10);margin-bottom:12px;
}
.idkit .fish{width:116px;flex-shrink:0}
.idkit svg{display:block;width:100%;height:auto}
.idkit .t{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:16px;letter-spacing:.7px;
  color:var(--text);line-height:1.05;display:block;
}
.idkit .s{font-size:11px;color:var(--dim);margin-top:3px;display:block;line-height:1.35}

.search{
  display:flex;align-items:center;gap:8px;background:rgba(17,53,65,.06);
  border:1.5px solid rgba(17,53,65,.14);border-radius:10px;padding:8px 11px;margin-bottom:10px;
}
.search input{
  flex:1;min-width:0;border:none;background:none;outline:none;font-size:13.5px;
  color:var(--text);font-family:'Inter',sans-serif;
}
.search input::placeholder{color:var(--dim)}

.shapes{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px}
.sh{
  border:1.5px solid rgba(17,53,65,.15);border-radius:10px;padding:4px 2px 2px;
  display:flex;flex-direction:column;align-items:center;
}
.sh svg{width:100%;height:auto}
.sh svg path,.sh svg rect{fill:var(--text)}
.sh svg circle{fill:var(--card)}
.sh .t{font-size:8px;color:var(--dim);text-align:center;line-height:1.15;margin-top:1px}
.sh.on{background:var(--ocean);border-color:var(--ocean)}
.sh.on .t{color:#fff}
.sh.on svg path,.sh.on svg rect{fill:#fff}
.sh.on svg circle{fill:var(--ocean)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  padding:4px 10px;border-radius:20px;border:1.5px solid rgba(17,53,65,.18);
  color:var(--dim);line-height:1.35;
}
.chip .sw{width:11px;height:11px;border-radius:50%;border:1px solid rgba(17,53,65,.25)}
.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.chip.on .sw{border-color:rgba(255,255,255,.6)}
.more{
  font-family:'Bebas Neue',Impact,sans-serif;font-size:12px;letter-spacing:1.2px;
  color:var(--ocean);padding:8px 0 2px;
}
.resbar{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  margin:13px 0 2px;padding-top:11px;border-top:1px solid rgba(17,53,65,.14);
}
.resbar .l{font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:.8px}
.resbar .r{font-size:10.5px;color:var(--dim);text-align:right}

/* ── detail sheet ────────────────────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:rgba(9,26,33,.62);display:none;
  align-items:flex-end;justify-content:center;z-index:100;
}
.scrim.open{display:flex}
.sheet{
  width:100%;max-width:600px;background:var(--sheet);border-radius:20px 20px 0 0;
  padding:12px 14px calc(20px + env(safe-area-inset-bottom));max-height:92vh;
  overflow-y:auto;color:var(--text);
}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(17,53,65,.25);margin:0 auto 10px}
.hero{width:100%;height:210px;object-fit:cover;border-radius:12px;display:block;background:#0d2b35}
.attrib{font-size:9.5px;color:var(--dim);margin-top:6px;line-height:1.45}
.attrib a{color:var(--ocean)}
.dname{font-family:'Bebas Neue',Impact,sans-serif;font-size:29px;letter-spacing:1px;line-height:1;margin-top:12px}
.dsci{font-size:12px;font-style:italic;color:var(--dim);margin-top:2px}
.dtags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dtag{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(17,53,65,.07);color:var(--dim)}
.block{margin-top:14px;padding-top:12px;border-top:1px solid rgba(17,53,65,.13)}
.months{display:flex;align-items:flex-end;gap:3px;height:46px}
.mo{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.mo .bar{width:100%;border-radius:2px 2px 0 0;background:rgba(17,53,65,.22);min-height:2px}
.mo.now .bar{background:var(--ocean)}
.mo .lb{font-size:8px;color:var(--dim)}
.mo.now .lb{color:var(--ocean);font-weight:700}
.cap{font-size:10.5px;color:var(--dim);margin-top:7px;line-height:1.45}
.lifebtn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:14px;
  padding:11px;border-radius:10px;border:1.5px solid var(--ocean);color:var(--ocean);
  font-family:'Bebas Neue',Impact,sans-serif;font-size:17px;letter-spacing:1px;
}
.lifebtn.on{background:var(--ocean);color:#fff}
.close{
  width:100%;margin-top:8px;padding:10px;border-radius:10px;color:var(--dim);
  font-family:'Bebas Neue',Impact,sans-serif;font-size:15px;letter-spacing:1px;
}
.empty{padding:36px 8px;text-align:center;color:var(--dim);font-size:13px;line-height:1.6}
:focus-visible{outline:2px solid var(--ocean);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="./">&larr; Swim</a>
    <h1>Who Lives Here</h1>
    <span class="spacer"></span>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabNow">What's about now</button>
    <button class="tab" id="tabId">Identify</button>
  </div>
  <div id="view"><div class="empty">Loading the bay…</div></div>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
(function(){
'use strict';

var DATA=null, SHAPES=[], MODE='now', SEL={shape:null,colour:null,mark:null,size:null}, Q='';
var MON=['J','F','M','A','M','J','J','A','S','O','N','D'];
var FULL=['January','February','March','April','May','June','July','August',
          'September','October','November','December'];
var NOW=new Date().getMonth();

/* Preferences, not identity (§4): on-device only, mirrored to a 400-day cookie
   because Safari ITP evicts localStorage after 7 idle days. */
function persistGet(k){
  try{ var v=localStorage.getItem(k); if(v!==null) return v; }catch(e){}
  var m=document.cookie.match('(^|;)\\s*'+k+'\\s*=\\s*([^;]+)');
  return m?decodeURIComponent(m[2]):null;
}
function persistSet(k,v){
  try{ localStorage.setItem(k,v); }catch(e){}
  try{
    document.cookie=k+'='+encodeURIComponent(v)+';max-age='+(400*86400)+';path=/;SameSite=Lax';
  }catch(e){}
}
var SEEN=(function(){ try{ return JSON.parse(persistGet('wlh_seen')||'[]'); }catch(e){ return []; } })();
function seen(id){ return SEEN.indexOf(id)>=0; }
function toggleSeen(id){
  var i=SEEN.indexOf(id);
  if(i>=0) SEEN.splice(i,1); else SEEN.push(id);
  persistSet('wlh_seen',JSON.stringify(SEEN));
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function el(id){ return document.getElementById(id); }

/* ── identikit: the chips assemble into one animal, so a swimmer matches a
   picture against a memory instead of matching a memory against three words. */
var HUE={grey:'#8d9aa1',white:'#e8edef',black:'#2b3338',brown:'#8a6a45',green:'#5e8a52',
  blue:'#3d7fb5',yellow:'#e8c33f',orange:'#d98338',red:'#b0392f',pink:'#dd8fa2',purple:'#8f6fa8'};
var INK_D='#20313a', INK_L='#f4f7f8';
function luma(h){var n=function(i){return parseInt(h.slice(i,i+2),16);};
  return (0.299*n(1)+0.587*n(3)+0.114*n(5))/255;}
function shade(h,f){var n=function(i){return Math.round(parseInt(h.slice(i,i+2),16)*f);};
  return '#'+[n(1),n(3),n(5)].map(function(v){return ('0'+v.toString(16)).slice(-2);}).join('');}

function idkit(shapeKey,hue,marks,finish){
  var sh=null,i;
  for(i=0;i<SHAPES.length;i++) if(SHAPES[i].key===shapeKey) sh=SHAPES[i];
  if(!sh) sh=SHAPES[0];
  if(!sh) return '';
  var W=84,H=56,m='',out='';
  var bodies=[],re=/<path d="([^"]+)"/g,mm;
  while((mm=re.exec(sh.path))) bodies.push(mm[1]);
  var eyes=[],re2=/<circle cx="([\d.]+)" cy="([\d.]+)" r="([\d.]+)"/g;
  while((mm=re2.exec(sh.path))) eyes.push([parseFloat(mm[1]),parseFloat(mm[2]),parseFloat(mm[3])]);
  var rects=[],re3=/<rect x="([\d.]+)" y="([\d.]+)" width="([\d.]+)" height="([\d.]+)"/g;
  while((mm=re3.exec(sh.path))) rects.push([mm[1],mm[2],mm[3],mm[4]]);
  var fill=HUE[hue]||HUE.grey, ink=luma(fill)<0.42?INK_L:INK_D;
  var eye=eyes.length?eyes[0]:null, x;

  if(marks.indexOf('bars-across')>=0)
    for(x=6;x<W;x+=11) m+='<rect x="'+x+'" y="-2" width="4.4" height="'+(H+4)+'" fill="'+ink+'" opacity=".72"/>';
  if(marks.indexOf('stripes-along')>=0)
    for(x=5;x<H;x+=8) m+='<rect x="-2" y="'+x+'" width="'+(W+4)+'" height="3.1" fill="'+ink+'" opacity=".72"/>';
  if(marks.indexOf('spots')>=0)
    for(var a=0,px=7;px<W;px+=10,a++) for(var b=0,py=7;py<H;py+=9,b++)
      if((a+b)%2===0) m+='<circle cx="'+px+'" cy="'+py+'" r="2.1" fill="'+ink+'" opacity=".66"/>';
  if(marks.indexOf('blotchy-mottled')>=0)
    [[14,18,7,5],[30,30,9,6],[48,16,8,5.5],[62,32,7.5,5],[24,40,6.5,4],[54,42,6,4]]
      .forEach(function(o){ m+='<ellipse cx="'+o[0]+'" cy="'+o[1]+'" rx="'+o[2]+'" ry="'+o[3]+'" fill="'+ink+'" opacity=".4"/>'; });
  if(marks.indexOf('one-dark-spot')>=0)
    m+='<circle cx="'+(W*0.66)+'" cy="'+(H*0.42)+'" r="5.4" fill="'+ink+'" opacity=".8"/>';
  if(marks.indexOf('dark-eye-bar')>=0&&eye)
    m+='<rect x="'+(eye[0]-3.4)+'" y="-2" width="6.8" height="'+(H+4)+'" fill="'+ink+'" opacity=".8"/>';
  if(marks.indexOf('net-or-scribble')>=0)
    for(x=-H;x<W+H;x+=9){
      m+='<path d="M'+x+' -2 L'+(x+H+4)+' '+(H+2)+'" stroke="'+ink+'" stroke-width="1.5" fill="none" opacity=".45"/>';
      m+='<path d="M'+x+' '+(H+2)+' L'+(x+H+4)+' -2" stroke="'+ink+'" stroke-width="1.5" fill="none" opacity=".3"/>';
    }

  var uid=Math.abs((shapeKey+hue+finish+marks.join()).split('').reduce(
    function(p,c){ return ((p<<5)-p+c.charCodeAt(0))|0; },0));
  var defs='',over='';
  if(finish==='silvery'){
    defs='<linearGradient id="f'+uid+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="#fff" stop-opacity=".62"/>'
      +'<stop offset=".42" stop-color="#fff" stop-opacity=".06"/>'
      +'<stop offset=".58" stop-color="#000" stop-opacity=".10"/>'
      +'<stop offset="1" stop-color="#fff" stop-opacity=".34"/></linearGradient>';
    over='<rect x="-2" y="-2" width="'+(W+4)+'" height="'+(H+4)+'" fill="url(#f'+uid+')"/>';
  }
  var clip=bodies.map(function(d){ return '<path d="'+d+'"/>'; }).join('');
  var outline=bodies.map(function(d){
    return '<path d="'+d+'" fill="none" stroke="'+shade(fill,.62)+'" stroke-width="1.4" stroke-linejoin="round"/>'; }).join('');
  var seabed=rects.map(function(r){
    return '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+INK_D+'" opacity=".3"/>'; }).join('');
  var eyeSvg=eyes.map(function(e){
    return '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="'+(e[2]+0.9)+'" fill="'+INK_L+'"/>'
         + '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="'+(e[2]*0.55)+'" fill="'+INK_D+'"/>'; }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><clipPath id="c'+uid+'">'+clip+'</clipPath>'+defs+'</defs>'
    +'<g clip-path="url(#c'+uid+')"><rect x="-2" y="-2" width="'+(W+4)+'" height="'+(H+4)+'" fill="'+fill+'"/>'
    +m+over+'</g>'+outline+seabed+eyeSvg+'</svg>';
}

/* ── seasonality: raw counts divided by that month's total observing, or a
   quiet winter reads as an absent animal rather than a quiet winter. */
function share(sp,i){
  var e=DATA.effort[i]; return e?sp.months[i]/e*1000:0;
}

function sizeLabel(s){
  if(s.size_cm==null) return null;
  var b=null;
  DATA.size_buckets.forEach(function(x){ if(x.key===s.size_bucket) b=x; });
  return b?b.label:null;
}

/* The month count is a rarity measure in disguise: a species with two records
   has an 8% chance of one landing in September — exactly random — whether or
   not it lives here all year. 67% of the list has 12 records or fewer, so
   showing a month count would tell 400 species' worth of lies. Total records
   is always true. Anything anchored to the reef, and most small resident fish,
   are simply here. */
function rowHTML(s,rank,showMonth){
  var c=s.months[NOW];
  var word = showMonth
    ? 'Seen '+c+' time'+(c===1?'':'s')+' here in '+FULL[NOW]
    : s.annual+' record'+(s.annual===1?'':'s')+' in the bay';
  return '<button class="row" data-id="'+s.id+'">'
    +(rank?'<span class="rank">'+rank+'</span>':'')
    +'<img loading="lazy" src="species/'+esc(s.img)+'" alt="">'
    +'<span class="b"><span class="n">'+esc(s.name)+'</span>'
    +'<span class="s">'+esc(s.sci)+'</span>'
    +'<span class="w"><span class="dot"></span>'+word+'</span></span>'
    +(seen(s.id)?'<span class="seen">&#10003;</span>':'')+'</button>';
}

function renderNow(){
  var list=DATA.species.filter(function(s){ return s.months[NOW]>0 && s.img; })
    .sort(function(a,b){ return b.months[NOW]-a.months[NOW]; }).slice(0,40);
  el('view').innerHTML=
    '<div class="strip">'
    +'<div class="live"><span style="font-size:19px">&#128032;</span><span>'
    +'<span class="t">Most often seen around now</span>'
    +'<span class="d">From ten years of observations by 206 contributors</span></span></div>'
    +'<p class="lbl">In '+FULL[NOW]+'</p>'
    +'<div class="rows">'+list.map(function(s,i){ return rowHTML(s,i+1,true); }).join('')+'</div>'
    +'<p class="stamp">Counts as at '+DATA.generated_at.slice(0,10)+' &middot; rebuilt quarterly</p>'
    +'</div>';
}

var COLOURS=[['grey','Silver / grey','#b9c4c9'],['brown','Brown','#8a6a45'],
  ['white','White','#e8edef'],['black','Black','#2b3338'],['yellow','Yellow','#e8c33f'],
  ['blue','Blue','#3d7fb5'],['green','Green','#5e8a52'],['red','Red','#b0392f'],
  ['orange','Orange','#d98338'],['pink','Pink','#dd8fa2'],['purple','Purple','#8f6fa8']];
var MARKS=[['plain','Plain'],['bars-across','Bars across'],['stripes-along','Stripes along'],
  ['spots','Spots'],['blotchy-mottled','Blotchy'],['one-dark-spot','One dark spot'],
  ['dark-eye-bar','Bar through the eye'],['net-or-scribble','Net or scribble']];

/* Shape, size and the search box EXCLUDE. Colour and markings only DEMOTE.
   Water eats red first, so 34% of these photos have their red badly
   suppressed and a brown Coffin Ray reads silver-grey. A colour tag
   therefore describes the photograph at least as much as the animal, and
   excluding on it would make a correctly-remembered animal unfindable.
   The swimmer's eye loses the same red at the same depth, so neither
   reading is authoritative — which is exactly why colour reorders instead
   of deciding. Same demote-never-hide rule as the out-of-season tail. */
function hardMatch(s){
  if(Q){
    var q=Q.toLowerCase();
    if((s.name+' '+s.sci).toLowerCase().indexOf(q)<0) return false;
  }
  if(SEL.shape && s.shape!==SEL.shape) return false;
  if(SEL.size && s.size_bucket!==SEL.size) return false;
  return true;
}
function softMatch(s){
  if(SEL.colour && s.colour!==SEL.colour && s.colour2!==SEL.colour) return false;
  if(SEL.mark && (s.markings||[]).indexOf(SEL.mark)<0) return false;
  return true;
}
function matches(s){ return hardMatch(s); }

function renderId(){
  var all=DATA.species.filter(function(s){ return s.img; });
  var hits=all.filter(matches);
  /* Most likely first: what is actually about this month, then how often the
     animal is seen here at all. */
  hits.sort(function(a,b){ return (b.months[NOW]-a.months[NOW]) || (b.annual-a.annual); });
  var soft=hits.filter(softMatch), off=hits.filter(function(s){ return !softMatch(s); });
  var shown=soft.slice(0,80), other=off.slice(0,30);
  var softOn=!!(SEL.colour||SEL.mark);

  var bits=[SEL.shape,SEL.colour,SEL.mark,
            SEL.size?(sizeLabelFor(SEL.size)):null].filter(Boolean);
  el('view').innerHTML=
    '<div class="strip">'
    +'<div class="idkit"><span class="fish">'
    + idkit(SEL.shape||'torpedo', SEL.colour||'grey', SEL.mark?[SEL.mark]:[], null)
    +'</span><span><span class="t">'+(bits.length?'Is this what you saw?':'Pick what you remember')+'</span>'
    +'<span class="s">'+(bits.length?bits.map(function(b){return esc(String(b).replace(/-/g,' '));}).join(' · '):'Shape first &mdash; it is what people actually retain')+'</span></span></div>'

    +'<div class="search"><span style="color:var(--dim)">&#128269;</span>'
    +'<input id="q" type="search" placeholder="Search '+DATA.species.length+' species…" value="'+esc(Q)+'"></div>'

    +'<p class="lbl">Shape</p><div class="shapes">'
    + SHAPES.map(function(sh){
        return '<button class="sh'+(SEL.shape===sh.key?' on':'')+'" data-shape="'+sh.key+'">'
          +'<svg viewBox="0 0 84 56" aria-hidden="true">'+sh.path+'</svg>'
          +'<span class="t">'+esc(sh.label)+'</span></button>'; }).join('')
    +'</div>'

    +'<p class="lbl">Size</p><div class="chips">'
    + DATA.size_buckets.map(function(b){
        return '<button class="chip'+(SEL.size===b.key?' on':'')+'" data-size="'+b.key+'">'+esc(b.label)+'</button>'; }).join('')
    +'</div>'

    +'<p class="lbl">Colour</p><div class="chips">'
    + COLOURS.map(function(c){
        return '<button class="chip'+(SEL.colour===c[0]?' on':'')+'" data-colour="'+c[0]+'">'
          +'<span class="sw" style="background:'+c[2]+'"></span>'+c[1]+'</button>'; }).join('')
    +'</div>'

    +'<p class="lbl">Markings</p><div class="chips">'
    + MARKS.map(function(m){
        return '<button class="chip'+(SEL.mark===m[0]?' on':'')+'" data-mark="'+m[0]+'">'+m[1]+'</button>'; }).join('')
    +'</div>'

    +'<div class="resbar"><span class="l">'+soft.length+' match'+(soft.length===1?'':'es')+'</span>'
    +'<span class="r">Most likely first</span></div>'
    +'<div class="rows">'
    + shown.map(function(s){ return rowHTML(s,null); }).join('')
    + (softOn&&other.length
        ?'<div class="divider">'+softLabel()+' &middot; '+off.length+'</div>'
         +'<p class="cap" style="padding-bottom:4px">'+softWhy()+'</p>'
         + other.map(function(s){ return rowHTML(s,null); }).join(''):'')
    +'</div>'
    + (soft.length+off.length?'':'<p class="empty">Nothing matches all of that.<br>Try dropping a filter &mdash; the shape is the one most worth keeping.</p>')
    +'<p class="stamp">Attributes derived from photographs taken in this bay &middot; '
    +'counts as at '+DATA.generated_at.slice(0,10)+'</p>'
    +'</div>';

  var q=el('q');
  if(q){
    q.addEventListener('input',function(e){
      Q=e.target.value;
      var pos=e.target.selectionStart;
      renderId();
      var n=el('q'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
    });
  }
}
/* The demoted tail has to name the thing that actually differs. Saying
   "a different colour" when the swimmer picked a marking is worse than saying
   nothing: it sends them checking a filter they never touched. */
function softLabel(){
  if(SEL.colour&&SEL.mark) return 'Recorded a different colour or markings';
  if(SEL.mark) return 'Recorded different markings';
  return 'Recorded a different colour';
}
function softWhy(){
  if(SEL.colour&&!SEL.mark)
    return 'Water eats red before anything else, so an animal can be photographed '
         + 'looking quite unlike itself. These match the shape.';
  if(SEL.mark&&!SEL.colour)
    return 'Markings are read from one photograph, and a pattern can be hidden by '
         + 'angle, growth or a fish that simply was not showing it. These match the shape.';
  return 'Colour and markings are both read from a single photograph, which water and '
       + 'angle can make unreliable. These match the shape.';
}
function sizeLabelFor(key){
  var out=null;
  DATA.size_buckets.forEach(function(b){ if(b.key===key) out=b.label; });
  return out;
}

function openDetail(id){
  var s=null;
  DATA.species.forEach(function(x){ if(String(x.id)===String(id)) s=x; });
  if(!s) return;
  var sh=s.months.map(function(_,i){ return share(s,i); });
  var peak=Math.max.apply(null,sh)||1;
  var best=0; sh.forEach(function(v,i){ if(v>sh[best]) best=i; });
  var tags=[s.shape,s.colour,(s.markings||[]).join(', '),s.where,s.finish]
    .filter(Boolean).map(function(t){ return String(t).replace(/-/g,' '); });
  var sz=sizeLabel(s);

  var sizeLine='';
  if(s.size_cm!=null){
    sizeLine='<p class="lbl">Size</p><p style="font-size:13px">'
      +'Typically about <strong>'+Math.round(s.size_cm)+' cm</strong>'
      +(sz?' &mdash; '+esc(sz):'')
      /* Only worth saying when it adds something. FishBase often gives the
         same figure for both, and "typically 40 cm / grows to 40 cm" reads
         like the page is padding. */
      +(s.max_cm && Math.round(s.max_cm) > Math.round(s.size_cm)
        ?'<br><span style="color:var(--dim);font-size:11.5px">Grows to '+Math.round(s.max_cm)+' cm</span>':'')
      +'</p>'
      +(s.size_source&&s.size_source.indexOf('http')===0
        ? '<p class="cap"><a href="'+esc(s.size_source)+'" target="_blank" rel="noopener">source</a></p>'
        : (s.size_source?'<p class="cap">'+esc(s.size_source)+'</p>':''));
  } else {
    /* Absent is grey, never invented (§8). */
    sizeLine='<p class="lbl">Size</p><p style="font-size:12.5px;color:var(--dim)">'
      +'No size on record for this one.</p>';
  }

  el('sheet').innerHTML='<div class="grab"></div>'
    +'<img class="hero" src="species/'+esc(s.img)+'" alt="'+esc(s.name)+'">'
    +'<p class="attrib">'+(s.credit?'Photo &copy; '+esc(s.credit)+' &middot; iNaturalist &middot; taken in this bay':'')
    +(s.obs_url?' &middot; <a href="'+esc(s.obs_url)+'" target="_blank" rel="noopener">observation</a>':'')
    +(s.distinctive?'<br>Look for: '+esc(s.distinctive):'')+'</p>'
    +'<p class="dname">'+esc(s.name)+'</p><p class="dsci">'+esc(s.sci)+'</p>'
    +'<div class="dtags">'+tags.map(function(t){ return '<span class="dtag">'+esc(t)+'</span>'; }).join('')+'</div>'
    +(s.grouping?'<p class="cap" style="margin-top:8px">Usually seen '+esc(s.grouping)+'</p>':'')
    +'<div class="block">'+sizeLine+'</div>'
    /* Three states, because "has a season" is not the default. Measured over
       570 species with enough NSW data: 13% have a real season, 49% are flat,
       and calling the flat ones seasonal would be inventing a pattern. The bay
       cannot see any of this — 67% of the list has 12 local records or fewer —
       so the shape is read at NSW scale and labelled as such. */
    +(s.season==='real'
      ?'<div class="block"><p class="lbl">When it’s about</p>'
        +'<div class="months">'+(s.season_share||[]).map(function(v,i){
            var pk=Math.max.apply(null,s.season_share)||1;
            return '<div class="mo'+(i===NOW?' now':'')+'">'
              +'<div class="bar" style="height:'+Math.max(2,Math.round(v/pk*36))+'px"></div>'
              +'<div class="lb">'+MON[i]+'</div></div>'; }).join('')+'</div>'
        +'<p class="cap">Strongest in '+FULL[s.season_peak]+'. Read across NSW, from '
        +s.season_records+' records, and divided by how much observing happened each '
        +'month — the bay alone is too thinly recorded to show a season.</p></div>'
      : s.season==='flat'
      ?'<div class="block"><p class="lbl">When it’s about</p>'
        +'<p style="font-size:13px">Here <strong>all year</strong>.</p>'
        +'<p class="cap">'+s.season_records+' records across NSW show no month it favours. '
        +'Most things anchored to the reef, and most small resident fish, simply stay put.</p></div>'
      :'<div class="block"><p class="lbl">When it’s about</p>'
        +'<p class="cap">Too few records anywhere to say anything about the time of '
        +'year.</p></div>')
    +'<button class="lifebtn'+(seen(s.id)?' on':'')+'" id="lifeBtn">'
    +(seen(s.id)?'✓ Seen it':'Mark as seen')+'</button>'
    +'<button class="close" id="closeBtn">Close</button>';
  el('scrim').classList.add('open');
  el('lifeBtn').onclick=function(){ toggleSeen(s.id); openDetail(id); render(); };
  el('closeBtn').onclick=closeDetail;
}
function closeDetail(){ el('scrim').classList.remove('open'); }

function render(){ if(MODE==='now') renderNow(); else renderId(); }

document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-id],[data-shape],[data-colour],[data-mark],[data-size]'):null;
  if(!t) return;
  if(t.dataset.id!=null){ openDetail(t.dataset.id); return; }
  var k=t.dataset.shape?'shape':t.dataset.colour?'colour':t.dataset.mark?'mark':'size';
  var v=t.dataset[k==='mark'?'mark':k];
  SEL[k]=(SEL[k]===v)?null:v;
  renderId();
});
el('scrim').addEventListener('click',function(e){ if(e.target===el('scrim')) closeDetail(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDetail(); });
el('tabNow').onclick=function(){ MODE='now'; el('tabNow').classList.add('on'); el('tabId').classList.remove('on'); render(); };
el('tabId').onclick =function(){ MODE='id';  el('tabId').classList.add('on');  el('tabNow').classList.remove('on'); render(); };

Promise.all([
  fetch('species/ctbar.json').then(function(r){ return r.json(); }),
  fetch('species/shapes.json').then(function(r){ return r.json(); })
]).then(function(res){
  DATA=res[0]; SHAPES=res[1];
  render();
}).catch(function(err){
  el('view').innerHTML='<div class="strip"><p class="empty">Couldn’t load the species list.'
    +'<br>It needs a connection the first time; after that it works offline.'
    +'<br><span style="opacity:.6">'+esc(err)+'</span></p></div>';
});
})();
</script>
</body>
</html>
