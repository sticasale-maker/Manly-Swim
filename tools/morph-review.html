<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Lives Here — morph review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Same colours as the shape review and the app, so a ruling made here looks
   like the thing it will change. */
:root{
  --deep:#113541; --shell:#0b222b; --shell-2:#102e39; --sheet:#eaf0f3;
  --ocean:#4a8fad; --dim:#4a5f6e; --rule:rgba(180,210,230,0.14);
  --shell-text:#cfe0e7; --shell-dim:#7d9aa6; --warn:#e08a3c; --good:#4caf50;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--shell);color:var(--shell-text);
  font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;flex-wrap:wrap;
  border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--shell);z-index:5}
.bar h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;
  letter-spacing:1px;color:#eaf3f6;white-space:nowrap;flex-shrink:0}
.bar .sub{font-size:12px;color:var(--shell-dim)}
.bar .grow{flex:1}
button{font:inherit;cursor:pointer;border:none;border-radius:8px}
.btn{background:var(--ocean);color:#fff;padding:7px 14px;font-size:13px;font-weight:600}
.btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--shell-text)}
.btn.bad{background:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}

.wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,560px);
  gap:22px;padding:20px;max-width:1240px;margin:0 auto;align-items:start}
.photo{background:var(--shell-2);border-radius:14px;padding:12px;position:sticky;top:64px}
.photo img{width:100%;height:auto;max-height:52vh;object-fit:contain;border-radius:10px;display:block;background:#000}
.photo .cap{font-size:11px;color:var(--shell-dim);margin-top:8px;line-height:1.45}
.photo .cap a{color:var(--ocean)}
.photo .none{padding:40px 10px;text-align:center;color:var(--shell-dim);font-size:12.5px}

.panel{background:var(--sheet);border-radius:14px;padding:16px;color:var(--deep)}
.nm{font-family:'Bebas Neue',Impact,sans-serif;font-size:28px;letter-spacing:.8px;line-height:1}
.sci{font-size:12.5px;font-style:italic;color:var(--dim);margin-top:2px}
.recs{font-size:12px;color:var(--ocean);font-weight:600;margin-top:5px}
.lbl{font-family:'Bebas Neue',Impact,sans-serif;font-size:11.5px;letter-spacing:1.5px;
  color:var(--dim);text-transform:uppercase;margin:16px 0 7px}

.morph{border:1.5px solid rgba(17,53,65,.14);border-radius:11px;padding:11px;margin-top:9px}
.morph.gone{opacity:.4}
.mhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mhead .x{margin-left:auto;background:transparent;color:var(--dim);font-size:17px;line-height:1;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:4px 10px;border-radius:20px;background:transparent;
  border:1.5px solid rgba(17,53,65,.18);color:var(--dim);display:flex;align-items:center;gap:5px}
.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex-shrink:0}
.sub2{font-size:11px;color:var(--dim);margin:8px 0 4px}
.desc{width:100%;font:inherit;font-size:12.5px;padding:6px 9px;margin-top:6px;
  border:1.5px solid rgba(17,53,65,.16);border-radius:8px;background:#fff;color:var(--deep)}
.hint{font-size:11px;color:var(--dim);margin-top:9px;line-height:1.45}
.warnbox{background:rgba(224,138,60,.16);border-radius:9px;padding:9px 11px;
  font-size:12px;color:#7a4310;margin-top:12px;line-height:1.45}
.foot{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(17,53,65,.14)}
.foot .btn{flex:1;padding:10px}
.keys{font-size:11px;color:var(--dim);margin-top:9px;line-height:1.6}
.keys b{font-family:ui-monospace,Menlo,monospace;background:rgba(17,53,65,.08);
  padding:1px 5px;border-radius:4px;color:var(--deep)}
.empty{padding:60px 20px;text-align:center;color:var(--shell-dim);max-width:640px;margin:0 auto}
.empty h2{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;color:#eaf3f6;margin-bottom:8px}
.empty code{font-family:ui-monospace,Menlo,monospace;background:rgba(180,210,230,.1);
  padding:1px 5px;border-radius:4px;color:#cfe0e7}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.photo{position:static}}
</style>
</head>
<body>
<div class="bar">
  <h1>Morph review</h1>
  <span class="sub" id="pos">loading…</span>
  <span class="grow"></span>
  <span class="sub" id="tally">0 rulings</span>
  <button class="btn ghost" id="skipAll">Skip rest</button>
  <button class="btn" id="save">Save overrides</button>
</div>
<div id="app"></div>

<script>
const DATA_URL = '../species/ctbar.json';
const IMG_BASE = '../species/';
const STORE    = 'wlh_morph_review_v1';

/* The eleven the app already knows are right — their morphs were re-derived
   cold by a second pass and matched their own verified facts every time. They
   are shown last rather than skipped: agreement between two model passes is
   evidence, not proof, and a person may still spot a wrong colour. */
const CORROBORATED = new Set([
  'Notolabrus gymnogenis','Parma microlepis','Acanthurus olivaceus',
  'Anoplocapros inermis','Coris sandeyeri','Anampses elegans',
  'Macropharyngodon meleagris','Pseudojuloides elongatus',
  'Stethojulis strigiventer','Coris gaimard','Scarus rubroviolaceus']);

const COLOURS = [
  ['grey','#8d9aa2'],['white','#eceff1'],['black','#2b3338'],['brown','#7a5c3e'],
  ['green','#4f7f57'],['blue','#3f6f9c'],['yellow','#d8b23f'],['orange','#d1762f'],
  ['red','#b4483c'],['pink','#cf7f95'],['purple','#7a5f9c']];
const LABELS = ['male','female','juvenile','adult','initial-phase','terminal-phase'];

let QUEUE = [], i = 0;
let edits = JSON.parse(localStorage.getItem(STORE) || '{}');

async function grab(url){
  let res;
  try { res = await fetch(url); }
  catch (e) {
    throw new Error('Could not fetch ' + url + '. This page reads '
      + '<code>species/ctbar.json</code>, so it has to be served over HTTP from '
      + 'the <b>repo clone</b> — open a terminal there and run '
      + '<code>python -m http.server 8000</code>, then visit '
      + '<code>http://localhost:8000/tools/morph-review.html</code>. '
      + 'Opening the file directly with file:// will not work.');
  }
  if (!res.ok) throw new Error('Fetching ' + url + ' returned ' + res.status + '.');
  try { return await res.json(); }
  catch (e) { throw new Error(url + ' is not valid JSON: ' + e.message); }
}

/* Most-seen first. A wrong morph on the Blue Groper is seen by everyone who
   taps a colour; a wrong one on a species with two records is seen by nobody. */
function order(a,b){
  const ca = CORROBORATED.has(a.sci) ? 1 : 0, cb = CORROBORATED.has(b.sci) ? 1 : 0;
  return ca - cb || b.annual - a.annual;
}

function current(){
  const s = QUEUE[i];
  const e = edits[s.sci];
  if (e === null) return null;                        // ruled: not two forms
  return (e && e.morphs) ? e.morphs : s.morphs;
}

function setEdit(v){
  const s = QUEUE[i];
  if (v === undefined) delete edits[s.sci]; else edits[s.sci] = v;
  localStorage.setItem(STORE, JSON.stringify(edits));
  render();
}

function mutate(fn){
  const s = QUEUE[i];
  const ms = JSON.parse(JSON.stringify(current() || s.morphs));
  fn(ms);
  setEdit({ morphs: ms });
}

function render(){
  const app = document.getElementById('app');
  document.getElementById('tally').textContent =
    Object.keys(edits).length + ' ruling' + (Object.keys(edits).length===1?'':'s');

  if (i >= QUEUE.length){
    document.getElementById('pos').textContent = 'done';
    app.innerHTML = '<div class="empty"><h2>That is the lot</h2>'
      + '<p>' + Object.keys(edits).length + ' ruling(s) held in this browser. '
      + 'Press <b>Save overrides</b>, drop the file at '
      + '<code>tools/morph-overrides.json</code>, and re-run the bake — '
      + '<code>python tools/bake_ctbar.py</code> is enough, no API calls needed.</p></div>';
    return;
  }

  const s = QUEUE[i];
  const ms = current();
  const dropped = ms === null;
  document.getElementById('pos').textContent = (i+1) + ' of ' + QUEUE.length;

  app.innerHTML =
    '<div class="wrap">'
    + '<div class="photo">'
    +   (s.img ? '<img src="' + IMG_BASE + s.img + '" alt="">'
               : '<div class="none">No photograph of this one in the bay.</div>')
    +   '<p class="cap">The photograph shows ONE of these forms — usually the '
    +   'showiest, because that is what people photograph. Judge the list '
    +   'against what you know of the species, not against this picture.'
    +   (s.obs_url ? ' &middot; <a href="' + s.obs_url + '" target="_blank" rel="noopener">observation</a>' : '')
    +   '</p>'
    + '</div>'
    + '<div class="panel">'
    +   '<div class="nm">' + esc(s.name) + '</div>'
    +   '<div class="sci">' + esc(s.sci) + '</div>'
    +   '<div class="recs">' + s.annual + ' records in the bay</div>'
    +   (CORROBORATED.has(s.sci)
        ? '<div class="warnbox">A second pass reached these forms independently '
          + 'and they matched this species’ own verified fact. Likely right — '
          + 'but check the colours.</div>' : '')
    +   '<p class="lbl">Does this species really look like this?</p>'
    +   (dropped
        ? '<div class="warnbox">Ruled <b>not two forms</b>. The morph set will be '
          + 'dropped and the species goes back to matching on its own record only.</div>'
        : ms.map(morphHTML).join(''))
    +   '<p class="hint">Colour is what the filter matches on, so it is the field '
    +   'worth getting right. The description is shown on the card.</p>'
    +   '<div class="foot">'
    +     '<button class="btn" id="ok">' + (dropped ? 'Undo' : 'Right — next') + '</button>'
    +     (dropped ? '' : '<button class="btn bad" id="no">Not two forms</button>')
    +   '</div>'
    +   '<p class="keys"><b>↵</b> right &middot; <b>x</b> not two forms &middot; '
    +   '<b>←</b> back &middot; <b>s</b> skip</p>'
    + '</div></div>';

  document.getElementById('ok').onclick = () => {
    if (dropped) { setEdit(undefined); return; }
    i++; render();
  };
  const no = document.getElementById('no');
  if (no) no.onclick = () => setEdit(null);

  app.querySelectorAll('[data-mi]').forEach(el => {
    el.onclick = () => {
      const mi = +el.dataset.mi;
      if (el.dataset.colour !== undefined){
        const slot = el.dataset.slot;             // colour | colour2
        const val  = el.dataset.colour;
        mutate(ms => { ms[mi][slot] = (ms[mi][slot] === val) ? null : val; });
      } else if (el.dataset.label !== undefined){
        mutate(ms => { ms[mi].label = el.dataset.label; });
      } else if (el.dataset.drop !== undefined){
        mutate(ms => { ms.splice(mi,1); });
      }
    };
  });
  app.querySelectorAll('textarea[data-desc]').forEach(t => {
    t.onchange = () => mutate(ms => { ms[+t.dataset.desc].describe = t.value.trim(); });
  });
}

function morphHTML(m, mi){
  const sw = c => (COLOURS.find(x => x[0]===c) || ['','#888'])[1];
  return '<div class="morph">'
    + '<div class="mhead"><div class="chips">'
    +   LABELS.map(l => '<button class="chip' + (m.label===l?' on':'') + '" '
        + 'data-mi="' + mi + '" data-label="' + l + '">' + l.replace(/-/g,' ')
        + '</button>').join('')
    + '</div><button class="x" data-mi="' + mi + '" data-drop="1" '
    + 'title="Remove this form">&times;</button></div>'
    + '<p class="sub2">Main colour</p><div class="chips">'
    +   COLOURS.map(c => '<button class="chip' + (m.colour===c[0]?' on':'') + '" '
        + 'data-mi="' + mi + '" data-slot="colour" data-colour="' + c[0] + '">'
        + '<span class="sw" style="background:' + c[1] + '"></span>' + c[0]
        + '</button>').join('')
    + '</div>'
    + '<p class="sub2">Second colour (optional)</p><div class="chips">'
    +   COLOURS.map(c => '<button class="chip' + (m.colour2===c[0]?' on':'') + '" '
        + 'data-mi="' + mi + '" data-slot="colour2" data-colour="' + c[0] + '">'
        + '<span class="sw" style="background:' + c[1] + '"></span>' + c[0]
        + '</button>').join('')
    + '</div>'
    + '<textarea class="desc" rows="2" data-desc="' + mi + '" '
    + 'placeholder="How it looks, for the card">' + esc(m.describe || '') + '</textarea>'
    + '</div>';
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (i >= QUEUE.length) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight'){ i++; render(); }
  else if (e.key === 'x'){ setEdit(null); }
  else if (e.key === 'ArrowLeft'){ i = Math.max(0,i-1); render(); }
  else if (e.key === 's'){ i++; render(); }
});

document.getElementById('skipAll').onclick = () => { i = QUEUE.length; render(); };
document.getElementById('save').onclick = () => {
  const doc = {
    _README: "Hand rulings on morph sets for Who Lives Here, keyed by SCIENTIFIC "
           + "name. bake_ctbar.py reads this immediately before emit, so a ruling "
           + "survives every re-bake and every regeneration of the morph pass. "
           + "null drops the set and returns the species to matching on its own "
           + "record; an object with a morphs list replaces it. Delete an entry to "
           + "hand the species back to the model.",
    _generated: new Date().toISOString().slice(0,10),
    ...edits,
  };
  const blob = new Blob([JSON.stringify(doc,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'morph-overrides.json';
  a.click();
};

async function boot(){
  try {
    const data = await grab(DATA_URL);
    const sp = data.species || data;
    QUEUE = sp.filter(s => (s.morphs || []).length > 1).sort(order);
    if (!QUEUE.length){
      document.getElementById('app').innerHTML =
        '<div class="empty"><h2>Nothing to review</h2><p>No species in '
        + '<code>species/ctbar.json</code> carries more than one appearance. '
        + 'Run <code>python tools/bake_ctbar.py --morphs</code> first.</p></div>';
      document.getElementById('pos').textContent = 'empty';
      return;
    }
    render();
  } catch (e) {
    document.getElementById('pos').textContent = 'error';
    document.getElementById('app').innerHTML =
      '<div class="empty"><h2>Couldn’t load the data</h2><p>' + e.message + '</p></div>';
  }
}

boot();
</script>
</body>
</html>
